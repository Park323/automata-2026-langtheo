# 확정 config — spec 7장에서 그대로 옮김.
# 값은 전부 확정되어 있습니다. facility.eff 만 A-4 자가검증 목표(A=2700 등)에서
# 역산한 값(1.0)입니다: to_progress(9000) = 9000 × eff × 0.3 = 2700 → eff = 1.0.

knob:
  comm_intl_ai: [6, 12, 24, 48]   # 유일한 실험 변수. Phase 1 은 최고값 48 고정

costs:
  comm_domestic:      3
  comm_intl_learner:  5
  ask_clarification:  3
  # **600 → 200** (8/20). 600 은 「생애소득의 몇 %」 로 잡은 값이었는데, 그 자는
  # 사람이 언어를 배우는 데 **몇 해를 쓰는가** 를 재지 않는다. 실측에서 정가 학습은
  # 30회(AP 3.0)라 최소 세 해였고, 아무도 끝내지 못했다.
  #
  # 자를 시간으로 바꾼다. 한 생애에서 언어에 쓰는 시간이 열 해면 넉넉하고, 수명 16해인
  # 이 세계로 옮기면 **두 해 남짓**이다. 200 이면 10회 = AP 1.0 = 한 해분의 행동력이고,
  # 소득 100 이니 돈으로는 두 해분이다 — 돈이 묶는 쪽이 두 해다.
  learn_base:       200
  # **할인은 정액이다** (8/20). ×0.5 였을 때 사유가 둘이면 ×0.25 라 정가와 4배가
  # 벌어졌고, 200 에서 그러면 50 — 두 번 만에 끝난다. 사유당 50 을 깎으면 사다리가
  # 200 · 150 · 100 으로 고르다 (10회 · 8회 · 5회).
  # **할인이 아니라 가속이다** (8/22). 전에는 필요액을 200 → 150 으로 깎았다. 그러면
  # **목표가 움직인다** — 반쯤 낸 학습이 갑자기 완성되는 경로가 생기고, 그 주변에서 이미
  # 버그를 한 번 잡았다.
  #
  # 이제 필요액은 200 에 고정하고 **회당 수확**을 올린다. 한 번(40원·0.2AP)에 40 이 쌓이는
  # 것이 정가이고, 사유 하나마다 +0.5배다.
  #
  #   사유 없음   회당 40   →  5회 · 200원 · AP 1.0
  #   하나        회당 60   →  4회 · 160원 · AP 0.8
  #   둘          회당 80   →  3회 · 120원 · AP 0.6
  #
  # **곱이 아니라 합이다.** ×1.5 를 두 번 곱하면 2.25 배가 되어 정가와 너무 벌어진다 —
  # 정액 할인으로 바꿀 때 같은 이유로 비율을 버렸다.
  learn_speedup:    0.5
  propose_vote:       0   # **무료.** 가난이 제안을 막으면 국토가 돈으로 정해진다.
                          # 문지기는 AP 다 (ap.propose_vote 0.6)
  # 위험 관측. **비싸야 한다** — 싸면 여러 번 재서 평균내는 것으로 오차가 사라지고
  # 국가 자본(기술력)을 올릴 이유가 없어진다. 국제 발신(노브 6~48)과 겨루는 값.
  observe_risk:      20
  # **한 번의 invest·learn 이 나가는 돈.** 금액을 인자로 받지 않는다 — 더 넣고 싶으면
  # 같은 행동을 다시 하면 된다. **프롬프트에 그렇게 적지는 않는다** — 도구를 여러 번
  # 부를 수 있다는 것은 이미 알고 있고, 적으면 「반복하라」 는 지시가 된다.
  #
  # 금액이 자유였을 때 표가 이랬다 — `600 · 額÷300`. 두 숫자가 무엇을 뜻하는지 읽어야
  # 하고 바로 다음 줄에 진척(0/600)이 또 나온다. 고정하면 `20 · 0.1` 한 쌍뿐이다.
  # **20 → 40** (8/22). AP 를 0.2 로 통일하면서 돈도 같이 올린다 — 안 올리면 학습이
  # 10회 = AP 2.0 이 되어 「AP 로 한 해, 돈으로 두 해」 가 무너진다.
  unit:              40

thresholds:
  # 창 [11186, 16780] 안의 0.95 지점. 창은 **실효 소득**에서 나온다 — 나이 배수 평균
  # 1.726 이 곱해진 값이다 (`adult_age` 를 5 로 내리면서 배수가 1.22 → 1.73 이 됐다:
  # 소득이 오르기 시작하는 나이가 다섯 해 빨라졌다). 상대 위치(0.95)는 100해 때부터 그대로다.
  # ★A·B·C·E 자가검증 통과.
  interceptor: 16500
  # 한 주기 전력 진척(3108)의 2배. 3배는 전 기간 진척(9324)의 천장에 붙어
  # 「아무리 파도 의미가 없다」 가 된다 — 여유를 둔다.
  bunker_scale: 6215

income:
  per_turn:      100          # 성인 나이(10세) 기준. 나이와 함께 오른다 — 아래 age_growth
  # **나이가 들면 더 번다** (8/22). 성인 나이 이후 한 해마다 `per_turn × age_growth` 씩.
  #
  #   나이 10   100        나이 16   220        나이 20   300
  #
  # 목적은 **말년에 소비가 못 따라가게** 하는 것이다. 한 해에 쓸 수 있는 돈은 행동력이
  # 묶는다 — invest 가 40원·0.2AP 이므로 전부 쏟아도 200 이 상한이고, 말하고 배우면 그보다
  # 적다. 그래서 나이 16 을 넘기면 **잉여가 강제로 쌓인다.**
  #
  # 그 잉여의 용처가 `give` 이고, 줄 사람을 만드는 것이 `bear_child` 다. 10해 실측에서
  # 아이를 낳은 사람이 0 이었던 이유가 「생애 한 번이니 최적 시점을 기다린다」 였는데,
  # 미루기를 벌하는 대신 **낳을 이유**를 만드는 쪽이다.
  #
  # 국가 총소득이 평균 1.22 배가 되므로 임계값도 같이 올렸다 (thresholds).
  age_growth:   0.20
  # **사람마다 다르게 번다** (8/22). 태어날 때 이 다섯 단계에서 하나를 뽑는다.
  #
  # **평균이 정확히 1.0 이어야 한다** — 임계값 창이 `per_turn × n × total` 에서 나오므로,
  # 평균이 1 이 아니면 창이 어긋나고 재계산이 필요하다.
  #
  # **이산인 이유는 말로 전할 수 있기 때문이다.** 「나는 한 번에 56 옮길 수 있다」 가
  # 메시지가 되고, 그걸 실제로 말하는지 채점할 수 있다. 연속 분포로는 그게 안 된다.
  spread: [0.6, 0.8, 1.0, 1.2, 1.4]
  initial_budget:  0              # 태어날 때 빈손. 0 이 아니면 사망이 돈을 찍어낸다

turn:
  action_points: 1.0              # 매 턴 리셋. 이월 안 됨

# **AP 가 이 세계의 진짜 예산이다.** 돈은 소득으로 계속 들어오지만 AP 는 턴마다 1.0 으로
# 리셋되고 이월되지 않는다. 무엇을 포기하는지가 여기서 정해진다.
#
# 그래서 **돈으로 막지 말아야 할 것은 AP 로 막는다.** 제안·투표에 돈을 물리면 참여가
# 재산이 되므로 둘 다 무료로 두고, 무게 차이는 AP 로만 준다.
ap:
  # **0.2 로 통일** (8/22) — speak · invest · learn 이 같은 값이다. 실측에서 AP 가
  # 병목이고 돈이 남았다 (턴 끝 예산 중앙 74 → 198 → 435, 남은 AP 중앙 0.0). 0.3 이면
  # 한 해에 세 번밖에 말할 수 없어 대화가 거기서 끊긴다.
  speak:           0.2   # 턴당 최대 5건
  ask:             0.2
  # **한 번의 invest·learn.** 10회면 AP 를 다 쓴다 = 200원.
  #
  # AP 로 본 단가는 200원/AP — 이전(300원/AP)보다 1.5배 비싸다. 투자가 말하기와 더 세게
  # 경쟁한다. 실측에서 invest 211건 > speak 176건이었던 것을 되돌리는 방향이다.
  #
  # 학습 사다리: 정가 200 은 10회 = AP 1.0, 국내 구사자 150 은 8회, 부모까지 100 은
  # 5회. AP 로는 한 해 안에 들어가고, 돈으로는 두 해가 든다 (소득 100).
  unit:            0.2
  propose_vote:    0.6   # **크게.** 국가의 용도를 여는 행위다. 돈을 안 받으므로
                         # (가난이 제안을 막으면 국토가 돈으로 정해진다) AP 가 유일한
                         # 문지기다. 0.6 이면 제안하고 한 번은 말할 수 있다
  vote:            0.05  # **매우 작게.** 採決 당일이야말로 설득이 필요한 날인데 표에
                         # AP 를 물리면 그날 말할 기회가 줄어든다. 돈을 안 물린 이유
                         # (참여가 재산이 되면 안 된다)가 AP 에도 그대로 적용된다
  observe_risk:    0.5   # **크게.** 세계를 재는 일이다. 재면 그 턴엔 한 번만 말한다
  memory_write:    0.0   # **공짜.** 기억은 행동이 아니라 생각의 정리다 — 무엇을 남길지
                         # 고민하는 데 값을 물리면 그 창발을 깎는다.
                         # 폭주는 RUNAWAY_CAP(64) 이 막는다
  # **아이 낳기는 그 해를 통째로 쓴다** (8/21). 전에는 `procreate` 가 공짜였다 — 진짜
  # 비용이 「남은 수명 전부」 였으니까. 이제 부모가 죽지 않으므로 그 비용이 사라졌고,
  # 대신 한 해의 행동력 전부를 쓴다. 돈은 0 이다 (가난이 재생산을 막으면 안 된다).
  bear_child:      1.0
  # 주는 것도 0.2 다. **크기가 수고를 바꾸지 않으므로** 한 번에 얼마든 넘긴다.
  give:            0.2
  procreate:       0.0   # 폐기 — 하위 호환. **공짜.** 진짜 비용은 남은 수명 전부였다
                         # 물려주는 선택이 두 번 벌받는다

growth:
  # 0.3 은 조율을 생색 수준으로 만든다 — 유치국 혼자 임계의 91% 에 닿아 나머지 두 나라가
  # 9% 만 대면 된다. 0.2 로 내리면 혼자 69% 라 31% 를 대야 하고, 성장 이득은 1.23× 로
  # 남아 farsighted 가 여전히 의미를 갖는다. 0.15 아래면 성장이 무의미해진다.
  growth_coef:  0.2               # multiplier = 1 + coef × √(national_capital / scale)
  growth_scale: 3000

survival:                         # spec 2.2. 세대 경계를 대신한다
  k:          8
  # 8.26 → 16.52. **소통 왕복 하나에 두 턴이 든다** (보내면 다음 턴 도착).
  # 기대수명 8턴이면 왕복 4회가 생애 전부라 조율을 배울 시간이 구조적으로 없다.
  lambda_base: 16.52              # 기대수명 16.06턴, 20턴을 넘길 확률 1%

risk:
  # 운석 충돌까지 남은 턴과 interceptor 임계를 함께 잰다. 둘 다 **하나의 상대 오차**에서
  # 유도한다 — 절대 턴 수로 두면 total_turns 를 줄인 런에서 깨진다 (20턴 런에서 ±50턴,
  # 임계 ±250% 가 나왔다).
  #
  #   σ비율 = sigma_ratio / (1 + √(국가자본 / growth_scale))
  #   남은 턴 ~ N(진실, (σ비율 × total_turns)²)     임계 ~ N(진실, (σ비율 × 임계)²)
  #
  # **정규분포다.** 꼬리에서는 크게 빗나간다 — 의도된 것이다. 대체로 맞되 가끔 크게
  # 틀리는 쪽이, 늘 일정 폭 안에서 틀리는 것보다 실제 계측에 가깝다.
  #
  #   자본     0 → σ 25%  (100턴 기준 σ=25턴 · 임계 ±4000)
  #   자본  3000 → 12.5%    자본 12000 → 8.3%       자본 27000 → 6.2%
  #
  # **0.5 에서 내렸다 (8/18).** 원래 0.25 도 기각했던 값인데, 그 이유(*"자본 0 에서도
  # 대략 알게 되어 국가 투자가 굳이 필요 없다"*)가 두 번 약해졌다.
  #
  #   ① `national` 에 쓸모가 늘었다 — 이제 수입·시설 전환율·관측 정확도에
  #      **턴당 투자 상한(AP 환산율)** 까지 걸린다. 관측 하나로만 팔지 않아도 된다.
  #   ② 0.5 는 **노이즈가 조율을 깨게** 만들었다. 그건 의도가 아니다.
  #
  # 0.5 에서 실제로 벌어진 일 — 진실 93턴을 46턴으로 읽은 에이전트가 "요격기는 불가능"
  # 을 선언하고 벙커로 갔다 (k48_s1 t7 Miris4). 관측 폭이 2~203 턴이었다.
  #
  # 값을 이렇게 고른다. 두 오독의 확률을 재고 무릎을 잡았다.
  #
  #   σ비율   임계폭    「자력으로 된다」   남은턴 σ   「시간이 없다」(t7, 진실 93턴)
  #    0.50   ±8019        19.0%          ±50턴        21.2%
  #    0.25   ±4010         4.0%          ±25턴         5.5%   ← 채택
  #    0.15   ±2406         0.2%          ±15턴         0.4%
  #    0.10   ±1604         0.0%          ±10턴         0.0%
  #
  # 오독률의 무릎은 0.15 다. **그보다 흐린 0.25 를 고른다** — 두 오독을 0 에 가깝게
  # 만드는 것이 목표가 아니다.
  #
  #   ① 임계가 선명해지면 산수로 풀리는 문제가 된다 (★B 가 형식만 남는다).
  #      ±4000 이어야 "혼자서는 안 된다" 가 계산이 아니라 판단으로 남는다.
  #   ② 한 번의 관측으로 충분해지면 **서로 알려줄 이유가 없어진다.** 관측 공유가
  #      지표 6a 가 재는 경로다. 0.25 면 3인 평균이 25턴→14턴으로 이득이 크다.
  #   ③ 나쁜 draw 로 오판하는 것 자체는 이 세계의 사건이다. 0.5 처럼 **노이즈가
  #      조율을 지배하는** 것이 문제였고, 4~6% 는 지배가 아니다.
  sigma_ratio: 0.25

wellness:
  gain: 0.008                     # 투자 1당 lambda 증가량. 에이전트에게 비공개

facility:
  # **사람마다 한 번에 옮기는 액수가 다르다** (8/22). `costs.unit × 이 배수`.
  # 소득 배수와 **독립으로** 뽑는다 — 「고소득·저처리」 와 「저소득·고처리」 가 같이 생기고,
  # 그 둘이 서로를 필요로 한다. 그것이 `give` 와 `speak` 가 필수가 되는 지점이다.
  #
  # **학습에는 안 걸린다.** 학습 눈금은 `x̂` 를 재는 자이므로 사람마다 달라지면 그 자가
  # 흔들린다 (spec 7).
  throughput_spread: [0.6, 0.8, 1.0, 1.2, 1.4]
  # eff 는 임계값 유도의 일부다. interceptor 8019 는 eff=1.0 × success_prob=0.3 을
  # 전제로 나온 값이므로, eff 를 바꾸면 thresholds 를 반드시 함께 재계산해야 한다.
  # (안 그러면 assert 가 걸린다 — 그게 안전장치다.)
  eff: 1.0                        # 투자 1당 진척 시행 횟수(기준값). A-4 목표에서 역산
  cap_per_turn: 500               # 턴당 **국가 단위** 시설 투자 상한 (A-1 기본값)
  transition_requires_vote: true
  transition_forfeits_progress: true

world:
  # 국가명은 서열·실세계 연상이 없는 가명 (A/B/C 는 순서 편향을 줌 — 리뷰 지적).
  # 언어는 파일럿에서 번역 모델을 확정한 ja/zh/fr 로 고정.
  countries:
    - {id: Asla,  lang: ja}
    - {id: Ranoa, lang: zh}
    - {id: Miris, lang: fr}
  agents_per_country: 3
  # **100 → 60** (8/21). 기대수명 16해이므로 60해는 세 세대 남짓이다 — 재생산과 언어
  # 단절이 여러 대에 걸쳐 관측되면서, 한 런의 벽시계·비용이 감당 가능한 길이다.
  # 임계값은 이 값에서 유도되므로 함께 내렸다 (아래 thresholds).
  total_turns: 60
  epoch_turns: 20                 # 창(A·E) 계산에 쓰는 '한 사람 몫의 기간'. 기대수명 반올림
  success_prob: 0.3               # 에이전트 비공개. 임계값이 이 값 기준으로 유도됨
  # 초기 나이를 1..10 에서 뽑는다. 전원 0살이면 **한꺼번에 죽는다** — 20턴 실측에서
  # t14~19 에 9명이 전부 교체됐고 쌓아둔 기억·관계·예산이 통째로 사라졌다.
  #
  # 8/21 에 성인 범위(10~13)로 좁혔다가 8/22 에 되돌렸다. 좁힌 이유(첫 해 사람들이 빈손인데
  # 줄 부모가 없다)는 소득 조건을 「부모가 살아 있는가」 로 바꾸면서 사라졌는데 그대로 남아
  # 있었다. 그리고 좁은 구간은 나이를 흩는 목적을 무력화한다 — **첫 해부터 세대 사다리가**
  # 있어야 성인 공백기가 안 생긴다: adult_age 5 이면 성인 5~6명 · 미성년 3~4명이다.
  init_age_max: 10
  # **성인 나이.** 이 나이부터 아이를 낳을 수 있고, 이 나이부터 소득을 받는다.
  # 그전에는 부모가 주는 돈이 전부다 — 그래서 「용돈」 이 실제 결정이 된다.
  # **10 → 5** (8/22). 산수가 안 맞았다.
  #
  #   초기 성인   10~13세 시작 · 16세 사망   →  성인으로 3~6해
  #   교체자      나이 0 으로 등장           →  성인이 되기까지 10해
  #
  # **성인 기간이 성장 기간보다 짧다.** 이 관계에서는 첫 세대가 전원 즉시 낳아도 세대가
  # 이어지지 않는다 — 부모가 죽고 4~7해 뒤에야 아이가 성인이 된다. 10턴 실측 세 번에서
  # 턴 9 부터 **성인이 0명**이었고, 그래서 `bear_child`·`give` 가 전부 0 이었다.
  #
  # 5 로 내리면 성인 기간 8~11해 > 성장 5해가 되어 세대가 이어진다.
  adult_age: 5
  # 세계 첫 해의 나이는 10~13 에서 뽑는다. **처음 사람들에게는 줄 부모가 없으므로**
  # 성인으로 시작한다 — 소득이 성인부터가 된 뒤로는 1~10 으로 뽑으면 대부분이 빈손인데
  # 받을 곳도 없다. 흩는 이유(한꺼번에 죽지 않게)는 그대로다.

inheritance:
  # **유언을 없앴다** (8/21). 부모가 살아 있으므로 세대 간 전달은 `speak` 로 한다 —
  # 특수 기능이 아니라 **기존 메시지 채널**로 관측되고, 여러 해에 걸쳐 반복할 수도 있다.
  # spec 3.3 의 「구전의 감쇠」 가 오히려 더 풍부하게 계측된다.
  #
  # **반쯤 배운 언어도 안 물려준다.** 부모가 살아 있으면 그 자체로 국내 구사자이므로
  # 아이의 학습이 이미 싸다 (부모 할인 −50 × 국내 구사자 할인 −50 = −100). 거기에 진척
  # 절반까지 얹으면 능력이 사실상 상속된다.
  #
  # 물려주는 것은 **부모 할인 자격**뿐이다. 돈은 부모가 살아서 주면 된다.
  parent_discount: true

length:
  message_max_chars:
    ja: 130
    zh:  90
    fr: 400
  understood_max_chars:  200
  translate_instruction_max_chars: 100
  on_overflow: truncate

llm:
  context_limit: 8192             # 개체 기억 (spec 4.5). 2^13
  warn_ratio:    0.7              # 5,734 토큰에서 압박 경고
  repeat_guard:  3                # 동일 (도구,인자) 반복 상한. max_steps 는 두지 않는다
  agent_model:     "qwen/qwen3.6-35b-a3b"                 # tools OK
  translate_model: "mistralai/mistral-small-3.2-24b-instruct"  # 파일럿 확정 — 고정 (바꾸지 말 것)
  temperature:     0.7
  # 응답 상한. 없으면 모델이 같은 문장을 반복하다 붕괴한다 — 실측에서 한 응답이
  # 40,935자였고 그 턴의 벽시계를 통째로 잡아먹었다. 사고를 껐으므로 출력은 도구 호출과
  # reasoning 문자열뿐이고 2048 이면 넉넉하다 (메시지 상한은 fr 400자).
  max_tokens:     2048
  # 사고를 끈다. **DeepInfra 에서 실제로 먹는 손잡이는 이것뿐이다.**
  # 같은 프롬프트로 3회씩 재봤다 (사고 토큰):
  #
  #   reasoning 없음              [602, 280, 572]
  #   effort: low                [481, 419, 477]
  #   effort: high               [438, 541, 476]   ← low 와 구분 안 됨
  #   reasoning.max_tokens 256   [323, 278, 319]   ← 256 을 넘긴다. 하드 캡이 아니다
  #   enabled: false             [  0,   0,   0]   ← 이것만 확실하다
  #
  # 20턴 비교에서 low/2048 과 medium/4096 의 사고 중앙값이 같았던 이유가 이것이다 —
  # 강도는 애초에 안 걸렸고 max_tokens 만 일하고 있었다.
  reasoning:
    enabled: false
  # 사고를 껐으므로 **도구마다 reasoning 을 다시 받는다** (spec 4.2 원안).
  # 안 켜면 지표 4(2단계 판정)의 ①이 읽을 근거가 통째로 사라진다.
  tool_reasoning: true
  provider:
    order: [akashml, parasail, atlas-cloud]
    allow_fallbacks: true

run:
  seed: 1
