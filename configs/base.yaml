# 확정 config — spec 7장에서 그대로 옮김.
# 값은 전부 확정되어 있습니다. facility.eff 만 A-4 자가검증 목표(A=2700 등)에서
# 역산한 값(1.0)입니다: to_progress(9000) = 9000 × eff × 0.3 = 2700 → eff = 1.0.

knob:
  # **유일한 실험 변수.** AI 번역으로 외국인에게 말하는 데 드는 **행동력**이다.
  #
  # 돈으로 매기던 것을 AP 로 옮겼다 (8/25 · #50 · #58). 돈은 예산 240 위에서 안 귀했고
  # `inh30` 에서 65% 가 그 위였다 — 표본 3분의 2에게 무력한 변수로는 Δx̂ 를 못 잰다.
  # AP 는 매년 1.0 으로 리셋돼 누구에게나 똑같이 귀하다.
  #
  # 매칭 20턴 실측(#58): 노브가 종속변수를 정면으로 움직였다.
  #
  #     0.2 (싼 번역)   언어 학습자 1명 · 학습 이벤트 5
  #     0.5 (비싼 번역) 언어 학습자 9명 · 학습 이벤트 34
  #
  # 자국·`original` 발신은 `ap.speak` 그대로다 — 노브가 재려는 마찰이 AI 번역에만 있다.
  comm_intl_ai_ap: [0.06, 0.08, 0.10, 0.12]   # 국제 원문 대비 1.0 · 1.33 · 1.67 · 2.0 배
  #
  # **바닥이 `ap.speak_intl` 이다** (8/26). 자국이 아니라 **국제 원문**과 겨룬다 —
  # AI 번역은 언어 마찰을 없애지 거리 마찰을 없애지 않으므로 노브도 국제 프리미엄을
  # 그대로 진다. 최저 눈금이 국제 원문과 같은 값인 것은 의도다: 「AI 가 언어 장벽을
  # 완전히 지운 세계」 가 이 실험이 경고하는 쪽 끝이다.
  #
  # 사다리를 1.0~2.5 에서 **1.0~2.0 으로 좁혔다.** 2.5 면 최고 눈금이 0.30 — 한 통에
  # 한 해의 30% 이고 그건 노브가 아니라 벌금이다 (같은 이유로 아침에 0.5 를 내렸다).
  # 001·002 비교에서 결과를 가른 것은 **최저 눈금 하나**였다.
  #
  # **[0.2~0.5] → [0.10~0.25]** (8/25 · Eddie). 배의 사다리는 **그대로다** —
  # `ap.speak` 도 절반이 됐으므로 1.0 · 1.5 · 2.0 · 2.5 배가 유지된다. 바뀐 것은
  # 절대 부담이다: 옛 0.5 는 **한 통에 반 해**였고, 학습 총비용이 0.80 이므로
  # **ai 두 통이 언어 하나보다 비쌌다.** 그건 노브가 아니라 벌금이다.
  #
  # 0.05 격자에서 speak 0.2 위에 사다리를 놓으려면 0.05 씩 올려야 하는데, 그러면
  # 0.25·0.30·0.35·0.40 처럼 배가 1.25~2.0 으로 뭉치거나 0.5 까지 가서 반 해가 된다.
  # **바닥을 내리는 것이 해상도를 얻는 유일한 길이었다.**
  #
  # 최저 눈금이 `ap.speak` 와 같은 것은 의도다 — 「AI 가 모국어만큼 싸다」 가 이 실험이
  # 경고하는 쪽 끝이다. `original` 은 학습 없이는 닿지 않으므로 같은 값이면 ai 가
  # 우월하고, 그 세계에서 아무도 안 배우는 것이 관측 대상이다.

costs:
  # **돈이 사라졌다** (8/25 · AP 전면 통일). 남은 둘은 가격이 아니라 **양**이다.
  #
  #   comm_domestic·comm_intl_learner·observe_risk·propose_vote 를 지웠다 — 전부 돈이었다.
  #   그 자리를 `ap.*` 가 그대로 대신한다. 마찰은 이제 한 종류다.
  learn_base:       80
  # 한 언어를 읽고 쓰기까지 쌓아야 하는 **진척**. 돈이 아니다 (원래도 진척이었다).
  # 사유가 없으면 `unit`(=40)씩 네 번 = **한 해 AP 의 0.80**. 사유가 붙으면 배속이
  # 올라 그만큼 덜 든다 — 아래 learn_speedup.
  #
  # **200 → 160** (8/25 · Eddie). 수명을 16.06 → 10.00 으로 줄일 때 이 값을 같이
  # 안 내렸다. 절대값은 그대로인데 **생애 비중이 1.61배**가 됐다:
  #
  #     사유 0 의 총 AP 1.00 = 생애의 6.2% → 10.0%
  #
  # 게다가 첫 해 나이가 1~7 이라 늦게 태어난 쪽은 회수 창이 2~4해뿐이다. 그러면
  # 「비싸서 안 배운다」 가 되고 암묵 효용 x 의 자가 한 칸으로 붕괴한다 — `rung` 이
  # 상수였을 때와 같은 실패다. 0.80 / 0.60 / 0.40 으로 눈금 셋이 살아 있다.
  #
  # 돈을 없애도 이 곡선은 그대로다. AP 가 원래부터 유일한 제약이었고 (`ap_used = ap.unit`),
  # 금액은 `gain / mult` 로 파생될 뿐 AP 를 안 건드렸다.
  learn_speedup:    0.5
  # 사유 하나당 배속 +0.5. 국내 구사자 · 부모 구사자 (spec 3.4).
  #
  #   사유 0 → 배속 1.0 → 5.0회 → AP 1.00 (한 해 전부)
  #   사유 1 → 배속 1.5 → 3.3회 → AP 0.67
  #   사유 2 → 배속 2.0 → 2.5회 → AP 0.50
  unit:              20
  # **한 번의 `invest`·`learn` 이 옮기는 양.** 가격이 아니라 처리량이다 — `ap.unit`(0.2)을
  # 내면 이만큼이 움직인다. `invest` 는 여기에 개체 배수(`throughput_spread`)가 곱해지고,
  # `learn` 은 배속이 곱해진다 (학습에는 개체 배수가 안 걸린다 — 자가 흔들린다, spec 7).

thresholds:
  interceptor: 10899
  # 창 [13900, 21060] 안의 **0.30** 지점. 창은 이제 **행동력 용량**에서 나온다 (8/25).
  #
  #   한 사람 한 해   AP 1.0 / 0.2 = 5회 × unit 40 = 200 투자량
  #   한 나라 전 기간 3명 × 200 × 50해 = 30,000        (개체 배수 평균 1.0)
  #   × k(eff 1.0 × success_prob 0.3) × 최선 국가효율 1.3
  #
  # **난이도는 안 바뀌었다.** 옛 창(실효소득 24,534 기준)의 1.47배인데 용량도 1.47배다 —
  # 돈이 AP 보다 낮은 천장이었고, 그 천장이 사라졌다.
  #
  # ★B 가 최선 국가효율 기준인 이유는 그대로다: 「한 나라가 혼자서는 못 한다」 는 가장
  # 잘 짓는 나라가 혼자서도 못 해야 성립한다.
  bunker: 4100
  # **한 나라가 혼자 닿을 수 있는 유일한 길.** 전 기간 전력 진척(9,000)의 67% 다.
  #
  # **1인부담은 요격기보다 비싸야 한다** — 8/25 에 「정확히 같게」 로 바꿨다가 되돌렸다.
  # 같으면 개인에게 비용도 결과(내가 산다)도 같은데 협력에는 **추가 비용**(말하기·학습
  # AP)과 **배신 위험**이 얹힌다 → 벙커가 지배하고 딜레마가 사라진다.
  #
  # 벙커의 유혹은 「싸다」 가 아니라 **「남이 필요 없다」** 다. 함정은 불신 때문에 더 비싼
  # 쪽을 택하는 것이고, 그 초과분이 불신의 가격이다.
  #
  #     혼자 벙커              기여 67% · 3명 · 아무도 안 믿어도 된다
  #     셋이 요격기(효율 1.3)     46% · 9명 · 두 나라를 믿어야 한다
  #     셋이 요격기(효율 1.0)     59% · 9명
  #     셋이 요격기(효율 0.7)     85% · 9명 ← 벙커가 낫다
  #
  # **6000 인 이유는 협력의 잉여가 노브 범위 안에서 갈리기 때문이다.** 요격기를 고르면
  # 20.7%p 의 AP 가 남고, 그 잉여로 살 수 있는 국제 발신이:
  #
  #     노브 0.2 → 연 1.05통   조율 가능
  #     노브 0.5 → 연 0.42통   조율 불가
  #
  # 그리고 **학습이 그 벽을 넘는 유일한 길**이다: 같은 잉여로 `original`(0.2)이면 연
  # 1.03통이다. 학습비 0.5~1.0 AP 를 한 번 내고 2~3해에 회수하며, 기대수명은 16해다.
  # 벙커를 7,000 으로 올리면 노브 0.5 에서도 0.64통이 되어 노브의 힘이 약해진다.
  # 한 주기 전력 진척(3,600)의 2배. 국가효율은 안 곱한다 — 요격기 전용이다.
  # 3배는 전 기간 진척(10,800)의 천장에 붙어 「아무리 파도 의미가 없다」 가 된다.

turn:
  action_points: 1.0              # 매 턴 리셋. 이월 안 됨

# **AP 가 이 세계의 진짜 예산이다.** 돈은 소득으로 계속 들어오지만 AP 는 턴마다 1.0 으로
# 리셋되고 이월되지 않는다. 무엇을 포기하는지가 여기서 정해진다.
#
# 그래서 **돈으로 막지 말아야 할 것은 AP 로 막는다.** 제안·투표에 돈을 물리면 참여가
# 재산이 되므로 둘 다 무료로 두고, 무게 차이는 AP 로만 준다.
ap:
  # **0.2 로 통일** (8/22) — speak · invest · learn 이 같은 값이다. 실측에서 AP 가
  # 병목이고 돈이 남았다 (턴 끝 예산 중앙 74 → 198 → 435, 남은 AP 중앙 0.0). 0.3 이면
  # 한 해에 세 번밖에 말할 수 없어 대화가 거기서 끊긴다.
  speak:           0.04  # **자국 내.** 한 해 25건
  speak_intl:      0.06  # **국경을 넘는 값** — 자국의 1.5배 (8/26 · Eddie).
                         # 전에는 둘이 같아서 국경의 마찰이 **오직 언어뿐**이었다.
                         # 원래 의도는 발신 자체에 차등을 두는 것이었다.
                         #
                         # 0.04 와 0.06 은 둘 다 0.02 의 배수라 **말하기끼리 섞는
                         # 조합이 촘촘하다.**
                         #
                         # **처음엔 0.08 / 0.12 로 적었다가 내렸다** (Eddie 지적).
                         # 다른 값을 전부 절반으로 내리면서 `speak` 만 0.8배로 내려,
                         # invest 대비 상대 가격이 0.50 → 0.80 으로 **오히려 비싸졌다.**
                         # 「다 같이 내린다」 고 적어 놓고 말하기만 어렵게 만든 것이다.
  # **0.2 → 0.1** (8/25 · Eddie). 노브의 해상도를 얻기 위해 바닥을 내렸다 (위 knob 참조).
  #
  # 난이도 검산은 안 건드린다 — `sweep.py`·`verify_config.py` 에 speak 이 **없다.**
  # 창 ★A·B·C·E 와 w* 는 `ap.unit`·`costs.unit`·임계로만 나온다.
  #
  # 걸리는 곳은 **조율 예산** 하나다. 조율 잉여(요격기가 벙커보다 1인당 10.8% 싸다)는
  # 런 전체 AP 9.76 이고, 그것으로 살 수 있는 국제 통수가 49 → 98 로 늘었다.
  # **그대로 둔다** — 예산이 빠듯해서 실패하면 원인이 노브가 아니라 가난이다.
  # 우리가 보려는 것은 「조율이 가능한 세계에서 왜 실패하는가」 다.
  # **한 번의 invest·learn.** 10회면 AP 를 다 쓴다 = 200원.
  #
  # AP 로 본 단가는 200원/AP — 이전(300원/AP)보다 1.5배 비싸다. 투자가 말하기와 더 세게
  # 경쟁한다. 실측에서 invest 211건 > speak 176건이었던 것을 되돌리는 방향이다.
  #
  # 학습 사다리 (`learn_base` 160 · `unit` 40 · 올림):
  #     사유 0  배수 1.0  40씩 4회  AP 0.80   생애의 8.0%
  #     사유 1  배수 1.5  60씩 3회  AP 0.60   생애의 6.0%
  #     사유 2  배수 2.0  80씩 2회  AP 0.40   생애의 4.0%
  # 마지막 한 번은 남은 만큼만 진척을 받지만 **AP 는 그대로 한 번을 먹는다** — 그래서
  # 사유 1 이 0.533 이 아니라 0.60 이다. 눈금은 올림이 만든다.
  unit:            0.10
  # **`propose_vote` 를 지웠다** (8/26 · Eddie). 採決을 시계가 연다 —
  # `world.ballot_every`. 값이 남아 있으면 코드가 읽지 않는 설정이 된다.
  vote:            0.04  # **국내 한 마디와 같은 값** (8/26 · Eddie). 「표 = 한 마디」 라는
                         # 대응이 읽기 쉽다. 전에는 0.05 로 더 작았고 근거는 아래와 같다 —
                         # 그 논거가 조금 깎이지만 여전히 가장 싼 축이다.
                         # (옛 주석) 採決 당일이야말로 설득이 필요한 날인데 표에
                         # AP 를 물리면 그날 말할 기회가 줄어든다. 돈을 안 물린 이유
                         # (참여가 재산이 되면 안 된다)가 AP 에도 그대로 적용된다
  observe_risk:    0.30  # **크게.** 세계를 재는 일이다.
                         # 0.5 → 0.4 → **0.6** (8/25 · Eddie). 0.4 로 내린 이유는
                         # 「재고 나면 두 번밖에 못 말한다」 였는데, `speak` 이 0.1 로
                         # 내려가 0.6 에서도 **네 번** 말할 수 있다. 그 근거가 사라졌다.
                         #
                         # 0.6 이 사는 것은 하나다 — **한 해에 두 번 잴 수 없다**
                         # (0.6+0.6 > 1.0). 잡음은 관측마다 새로 뽑히므로 두 번 재면
                         # σ 가 0.250 → 0.177 로 좁아지는데, 그 길이 막힌다.
                         #
                         # 세 값의 성질이 달라 **정확히 하나만** 맞는다:
                         #   남은 해수    진실이 매해 바뀐다 → 해 넘겨 평균 불가
                         #   두 임계      진실이 고정 → 해마다 한 번씩 재서 평균 가능
                         # 즉 **운석 시점만** 못 좁히게 된다. 「언제인지는 모르고 얼마가
                         # 필요한지는 안다」 — 같은 예산으로 엉뚱한 숫자에 합의하는 실패다
  memory_write:    0.04  # **국내 한 마디와 같은 값** (8/26 · Eddie). 전에는 공짜였다.
                         # 근거는 「기억은 행동이 아니라 생각의 정리다 — 값을 물리면
                         # 그 창발을 깎는다」 였고, 폭주는 RUNAWAY_CAP(64) 이 막는다고
                         # 적어 두었다. **그 그물이 실제로는 안 막았다** —
                         # `260826-002` 4해에서 Asla3 이 바이트까지 같은 글을 **51번**
                         # 썼고 (그 해 세계 111콜의 절반), 64 에 닿기 전에 스스로 나왔다.
                         #
                         # 값이 붙으면 두 가지가 따라온다:
                         #   · **무엇을 남길지 고르게 된다** — 한 마디를 포기하는 값이다
                         #   · **공짜 행동이 세계에서 사라진다.** `can_act` 의 특례가
                         #     통째로 없어지고 종료 판정이 AP 하나로 정리된다
  # **0.2 → 0.1** (8/23). 크기가 수고를 바꾸지 않으므로 한 번에 얼마든 넘긴다.
  # `inh30` 30해에서 `give` 가 **0건**이었다 (`invest` 694회). 불일치는 이미 있었으니
  # (26명 중 9명) 문제는 유인이 아니라 **경쟁 상대**였다 — 같은 0.2 면 남에게 주기보다
  # 남의 시설에 직접 붓는 쪽이 언제나 확실하다. 가장 싸게 만들어 그 비교를 깬다.
  give:            0.1
                         # 물려주는 선택이 두 번 벌받는다

growth:
  # 0.3 은 조율을 생색 수준으로 만든다 — 유치국 혼자 임계의 91% 에 닿아 나머지 두 나라가
  # 9% 만 대면 된다. 0.2 로 내리면 혼자 69% 라 31% 를 대야 하고, 성장 이득은 1.23× 로
  # 남아 farsighted 가 여전히 의미를 갖는다. 0.15 아래면 성장이 무의미해진다.
  growth_coef:  0.2               # multiplier = 1 + coef × √(national_capital / scale)
  # **3000 → 6000** (8/25 · AP 전면 통일). 이 값은 「한 주기 국가소득의 0.50배」 로
  # 잡은 것이었는데, 용량이 소득 100 에서 200 으로 바뀌면서 그 비가 0.25 로 떨어졌다 —
  # 국가 투자가 상대적으로 절반값이 되어 성장이 두 배 빨리 붙었다 (w* 0.50 → 0.30).
  #
  #   한 주기 국가 용량 = 200 × 3명 × 17해 = 10,200 · 그 절반이 5,100
  growth_scale: 6120

survival:                         # spec 2.2. 세대 경계를 대신한다
  k:          8
  # **16.52 → 10.09** (8/25). 16.52 로 올린 근거는 「소통 왕복 하나에 두 턴이 든다
  # (보내면 다음 턴 도착)」 였는데, **순차 라운드로빈에서는 같은 해에 도착한다** —
  # 그 근거가 낡았다. 왕복이 한 해 안에 끝나므로 10해로도 조율을 배울 시간이 있다.
  #
  # 세계 50해 ÷ 수명 10해 = **다섯 세대**. 전에는 60/16 ≈ 3.7 세대였다. 세대가 늘면
  # 유언·상속을 타는 전달이 더 여러 번 시험된다 (spec 3.3 의 구전).
  lambda_base: 4.78               # 살아낸 해 5.00 · Weibull 평균 4.50
                                  # **상대 분산은 그대로다** (8/26): sd/평균이
                                  # 0.144(수명 10) → 0.146(수명 5) 으로 같다.

risk:
  # 운석 충돌까지 남은 턴과 interceptor 임계를 함께 잰다. 둘 다 **하나의 상대 오차**에서
  # 유도한다 — 절대 턴 수로 두면 total_turns 를 줄인 런에서 깨진다 (20턴 런에서 ±50턴,
  # 임계 ±250% 가 나왔다).
  #
  #   σ비율 = sigma_ratio / (1 + √(국가자본 / growth_scale))
  #   남은 턴 ~ N(진실, (σ비율 × total_turns)²)     임계 ~ N(진실, (σ비율 × 임계)²)
  #
  # **정규분포다.** 꼬리에서는 크게 빗나간다 — 의도된 것이다. 대체로 맞되 가끔 크게
  # 틀리는 쪽이, 늘 일정 폭 안에서 틀리는 것보다 실제 계측에 가깝다.
  #
  #   자본     0 → σ 25%  (100턴 기준 σ=25턴 · 임계 ±4000)
  #   자본  3000 → 12.5%    자본 12000 → 8.3%       자본 27000 → 6.2%
  #
  # **0.5 에서 내렸다 (8/18).** 원래 0.25 도 기각했던 값인데, 그 이유(*"자본 0 에서도
  # 대략 알게 되어 국가 투자가 굳이 필요 없다"*)가 두 번 약해졌다.
  #
  #   ① `national` 에 쓸모가 늘었다 — 이제 수입·시설 전환율·관측 정확도에
  #      **턴당 투자 상한(AP 환산율)** 까지 걸린다. 관측 하나로만 팔지 않아도 된다.
  #   ② 0.5 는 **노이즈가 조율을 깨게** 만들었다. 그건 의도가 아니다.
  #
  # 0.5 에서 실제로 벌어진 일 — 진실 93턴을 46턴으로 읽은 에이전트가 "요격기는 불가능"
  # 을 선언하고 벙커로 갔다 (k48_s1 t7 Miris4). 관측 폭이 2~203 턴이었다.
  #
  # 값을 이렇게 고른다. 두 오독의 확률을 재고 무릎을 잡았다.
  #
  #   σ비율   임계폭    「자력으로 된다」   남은턴 σ   「시간이 없다」(t7, 진실 93턴)
  #    0.50   ±8019        19.0%          ±50턴        21.2%
  #    0.25   ±4010         4.0%          ±25턴         5.5%   ← 채택
  #    0.15   ±2406         0.2%          ±15턴         0.4%
  #    0.10   ±1604         0.0%          ±10턴         0.0%
  #
  # 오독률의 무릎은 0.15 다. **그보다 흐린 0.25 를 고른다** — 두 오독을 0 에 가깝게
  # 만드는 것이 목표가 아니다.
  #
  #   ① 임계가 선명해지면 산수로 풀리는 문제가 된다 (★B 가 형식만 남는다).
  #      ±4000 이어야 "혼자서는 안 된다" 가 계산이 아니라 판단으로 남는다.
  #   ② 한 번의 관측으로 충분해지면 **서로 알려줄 이유가 없어진다.** 관측 공유가
  #      지표 6a 가 재는 경로다. 0.25 면 3인 평균이 25턴→14턴으로 이득이 크다.
  #   ③ 나쁜 draw 로 오판하는 것 자체는 이 세계의 사건이다. 0.5 처럼 **노이즈가
  #      조율을 지배하는** 것이 문제였고, 4~6% 는 지배가 아니다.
  sigma_ratio: 0.25

wellness:
  gain: 0.0049                    # 투자 1당 lambda 증가량. 에이전트에게 비공개

facility:
  # **사람마다 한 번에 옮기는 액수가 다르다** (8/22). `costs.unit × 이 배수`.
  # 소득 배수와 **독립으로** 뽑는다 — 「고소득·저처리」 와 「저소득·고처리」 가 같이 생기고,
  # 그 둘이 서로를 필요로 한다. 그것이 `give` 와 `speak` 가 필수가 되는 지점이다.
  #
  # **학습에는 안 걸린다.** 학습 눈금은 `x̂` 를 재는 자이므로 사람마다 달라지면 그 자가
  # 흔들린다 (spec 7).
  throughput_spread: [0.4, 0.7, 1.0, 1.3, 1.6]   # 소득과 같은 폭으로 (8/23)
  # **나라마다 요격기를 짓는 속도가 다르다** (8/23). 나라 수만큼의 순열로 배정된다 —
  # 시드마다 어느 나라가 최선인지 달라지므로 나라 정체성·언어와 교락되지 않는다.
  # 벙커에는 안 걸린다: 요격기 전용이라 「최고 효율 나라가 벙커를 골랐다」 가 진짜
  # 손실이 되고 함정이 날카로워진다.
  #
  # 1.3 인 이유는 셋이 깔끔하게 갈리기 때문이다 (세 나라 전력 대비 필요량):
  #   효율 0.7 에 몰아주면 110%  불가능 — 잘못 고르면 죽는다
  #   효율 1.0 에 몰아주면  77%  가능
  #   효율 1.3 에 몰아주면  59%  여유
  # 1.2 는 최악(89%)도 살아남아 압력이 약하고, 1.4 는 중간(83%)까지 빠듯해진다.
  # **순서가 곧 배정이다** (8/27 · Eddie). 섞지 않으므로 `world.countries` 순서와
  # 짝지어진다: Asla 1.0 · Ranoa 1.3 · Miris 0.7. 씨앗은 나이·처리량·LLM 확률성만
  # 바꾸고 배수는 상수로 둔다 — 반복에서 변수를 하나로 줄이려는 것이다.
  #
  # 지금 배치의 뜻: **선점하는 나라(Asla)가 중간 효율이고 최고 효율(Ranoa)이 놓친다.**
  # 실측에서 반복된 실패가 그것이었다 (「선점이 효율을 이겼다」).
  build_spread: [1.0, 1.3, 0.7]
  # eff 는 임계값 유도의 일부다. interceptor 8019 는 eff=1.0 × success_prob=0.3 을
  # 전제로 나온 값이므로, eff 를 바꾸면 thresholds 를 반드시 함께 재계산해야 한다.
  # (안 그러면 assert 가 걸린다 — 그게 안전장치다.)
  eff: 1.0                        # 투자 1당 진척 시행 횟수(기준값). A-4 목표에서 역산
  # **cap_per_turn 을 지웠다** (8/25). 턴당 국가 단위 **돈** 상한이었다. 이제 상한은
  # 행동력이 정한다 — 한 나라가 한 해에 옮길 수 있는 양은 3명 × 5회 × 40 = 600 이 최대다.
  transition_requires_vote: true
  transition_forfeits_progress: true

world:
  # 국가명은 서열·실세계 연상이 없는 가명 (A/B/C 는 순서 편향을 줌 — 리뷰 지적).
  # 언어는 파일럿에서 번역 모델을 확정한 ja/zh/fr 로 고정.
  countries:
    - {id: Asla,  lang: ja}
    - {id: Ranoa, lang: zh}
    - {id: Miris, lang: fr}
  agents_per_country: 3
  # ── 採決을 시계가 연다 (8/26 · Eddie) ────────────────────────────────────
  # 1해부터 3해마다 전 국가가 동시에 採決한다 (1·4·7·…·28 — 열 번). 소집도 유예도
  # 없고 사이의 두 해가 논의 기간이다. 근거는 `core/config.py` World 주석에 있다:
  # 발의 한 해 차이가 30해를 정했고(배수 1.3 인 나라가 숙주를 놓쳤다), 제안자가 죽으면
  # 採決이 비었다. **첫 해부터 강제**하는 것은 의도된 선택이다 — 정보 교환이 거의 없는
  # 시점에 확정지어 버리는 것도 조건이다.
  ballot_every: 3
  ballot_from: 1
  # **국토 전환 = 타국 기여분만 소각** (8/26 · Eddie). 설정값이 없다 — 규칙이다
  # (`Country.kept_on_switch`). 자국이 쌓은 몫은 남고 남이 쌓아준 것은 사라진다.
  #
  # 전액 소각은 전환을 산술적으로 불가능하게 만들어 採決을 형식으로 바꿨고, 균등 50%
  # 소각에는 구멍이 있었다 — 요격기 8,200 을 넘기면 전환 즉시 벙커(4,100)가 완성돼
  # **숙주가 무료로 배신**할 수 있었다. 자국 몫만 남기면 그 구멍이 스스로 닫힌다:
  # 도움을 많이 받아 숙주가 된 나라일수록 빠져나갈 수 없다.
  # **100 → 60** (8/21). 기대수명 16해이므로 60해는 세 세대 남짓이다 — 재생산과 언어
  # 단절이 여러 대에 걸쳐 관측되면서, 한 런의 벽시계·비용이 감당 가능한 길이다.
  # 임계값은 이 값에서 유도되므로 함께 내렸다 (아래 thresholds).
  total_turns: 30
  # 창(A·E) 계산에 쓰는 '한 사람 몫의 기간'. **`total_turns / 3` 이다.**
  #
  # **50 은 3 으로 안 나뉘므로 ★A 와 ★B 가 갈린다** (8/25). 전에는 3×20 = 60 이라 정확히
  # 같은 수였다 (A = B = 11,700 자리). 지금은 3×17 = 51 > 50 이라 A(11,934) > B(11,700) 다.
  # 창의 하한을 정하는 것은 여전히 ★E(13,900) 하나이므로 임계에는 영향이 없다.
  epoch_turns: 10
  # **수명이 아니라 「몰아치기 방지 기간」 이다** (8/26 · Eddie 질문). 창의 ★A·★E 가
  # 여기 걸린다 — 「마지막 한 주기에 3국이 전력을 다해도 불가」·「한 주기를 통째로 쉬면
  # 불가」. 수명 1세대(5)로 맞추면 문장이 예뻐지지만 ★E 바닥이 10,530 으로 올라
  # **세계가 15% 어려워진다** (임계/총용량 0.138 → 0.159 · w* 0.30 → 0.40).
  # 10 이면 그 비중이 0.138 로 옛 세계와 같다.
  # **투자는 잃을 수도 있다** (8/26 · Eddie). 전에는 `Binom(n, 0.3)` 이라 진척이 절대
  # 음수가 안 됐다 — 「투자」 라고 부르면서 원금 손실이 없었다.
  #
  #     역화 아님 (85%)   +Binom(n, 0.45)
  #     역화     (15%)   −Binom(n, 0.30)
  #
  # 기댓값 0.30n → **0.3375n** (+12.5%) · 표준편차 **2.8배** · 음수 확률 15%.
  # 그 15% 는 **규모와 무관하다** — 역화가 부호를 뒤집는 혼합분포라 분산의 큰 몫이 `n` 과
  # 무관하다. 「크게 투자하면 안전」 이 안 되고, 위험이 계층과 무관하게 남는다:
  #
  #     n= 5 (약자·나쁜 나라)  평균 1.69  sd 1.73  sd/평균 1.03
  #     n=41 (강자·좋은 나라)  평균 13.8  sd 11.5  sd/평균 0.83
  #
  # 나라 한 해 합계는 반대다 — 14회만 모이면 sd/평균 0.23, 음수 확률 0.00%.
  # **개인은 위험을 크게 느끼고 나라는 거의 안 느낀다.** 그래서 `destroy` 의 크기가
  # 나라 한 해 자연 변동(sd 약 21) 근처여야 모호성이 유지된다 — 그보다 크면 탐지된다.
  success_prob: 0.45              # 에이전트 비공개. 역화가 아닐 때의 시행 확률
  backfire_prob: 0.15             # 역화 확률. 부호가 뒤집힌다
  backfire_hit: 0.30              # 역화일 때의 시행 확률
  # 초기 나이를 1..10 에서 뽑는다. 전원 0살이면 **한꺼번에 죽는다** — 20턴 실측에서
  # t14~19 에 9명이 전부 교체됐고 쌓아둔 기억·관계·예산이 통째로 사라졌다.
  #
  # 8/21 에 성인 범위(10~13)로 좁혔다가 8/22 에 되돌렸다. 좁힌 이유(첫 해 사람들이 빈손인데
  # 줄 부모가 없다)는 소득 조건을 「부모가 살아 있는가」 로 바꾸면서 사라졌는데 그대로 남아
  # 있었다. 그리고 좁은 구간은 나이를 흩는 목적을 무력화한다 — **첫 해부터 세대 사다리가**
  # 있어야 성인 공백기가 안 생긴다: adult_age 5 이면 성인 5~6명 · 미성년 3~4명이다.
  init_age_max: 3    # 수명 5 에 맞춘다 (옛 세계는 수명 10 에 7)
  # **`adult_age` 를 지웠다** (8/25 · AP 전면 통일). 이 값이 하던 일은 둘이었고 둘 다
  # 없어졌다: ① 미성년 무소득 판정 — 소득이 사라졌다. ② `age_growth` 의 기준점 —
  # 그 값도 없앴다 (AP 는 이월이 안 되므로 「말년에 잉여」 가 성립하지 않는다).
  #
  # 아무도 읽지 않는 값을 남기면 다음에 그것을 근거로 삼는다.

length:
  message_max_chars:
    ja: 130
    zh:  90
    fr: 400
  understood_max_chars:  200
  translate_instruction_max_chars: 100
  on_overflow: truncate

llm:
  context_limit: 8192             # 개체 기억 (spec 4.5). 2^13
  warn_ratio:    0.7              # 5,734 토큰에서 압박 경고
  repeat_guard:  3                # 동일 (도구,인자) 반복 상한. max_steps 는 두지 않는다
  agent_model:     "deepseek/deepseek-v4-flash"           # tools OK · 사고형
  # **번역기를 qwen3.6 으로 옮겼다** (8/27 · Eddie). mistral-small 3.2 는 이 모델을
  # 서빙하는 곳이 셋뿐이고 **같은 정밀도는 DeepInfra 하나**였다. 그 하나가 막혀
  # 260827-002 가 18해에 섰고, 번역 5통이 유실됐다 (국제 메시지의 1.0% — 규칙대로
  # 불달한 2.3% 와 같은 자리수라 인공물이 신호를 먹는다).
  #
  # qwen3.6-35b-a3b 는 **fp8 이 여덟 곳**이다. 속도는 같다 (실측 3문장):
  #
  #     mistral-small 3.2   지연중앙 1,780ms   fp8 1곳
  #     qwen3.6-35b-a3b     지연중앙 2,007ms   fp8 8곳
  #
  # ⚠ **사고를 반드시 끈다** — 이 모델은 기본이 사고 ON 이고, 그러면 번역 한 통이
  #   40~100초·사고 1,800~3,700 토큰이 된다 (30배). 그런데 번역문은 사실상 같았다:
  #
  #     ON   距离陨石还有约17年。拦截机需要11858的进度，目前仅为2638。…   44,658ms
  #     OFF  距离陨石撞击还有约17年。拦截系统需要11858的进度，目前仅有2638。… 1,730ms
  #
  #   숫자 보존도 3/3 로 같다. 사고가 번역에 아무것도 보태지 않는다.
  translate_model: "qwen/qwen3.6-35b-a3b"
  temperature:     0.7
  # 응답 상한. 없으면 모델이 같은 문장을 반복하다 붕괴한다 — 실측에서 한 응답이
  # 40,935자였고 그 턴의 벽시계를 통째로 잡아먹었다. **사고와 나눠 쓴다.**
  #
  # 20턴 실측 (같은 시드·노브): 2048 로 조이면 잘림이 9% → 19% 로 두 배가 되고 메시지가
  # 23% 줄었다. 우리 병목은 비용이 아니라 표본 수라 그 거래는 손해다.
  max_tokens:     4096
  # **사고를 켠다** (8/25). 8/16 에 껐던 것을 되돌린다.
  #
  # 껐던 근거는 「DeepInfra 가 effort 를 무시한다」 였다 — 같은 프롬프트 3회씩:
  #
  #   effort: low                [481, 419, 477]
  #   effort: high               [438, 541, 476]   ← low 와 구분 안 됨
  #   enabled: false             [  0,   0,   0]   ← 이것만 확실했다
  #
  # 그 관측은 **끄는 것이 가능하다**는 뜻이고 **꺼야 한다**는 뜻이 아니었다. 강도를
  # 못 고르는 것과 사고 자체를 버리는 것은 다르다. deepseek-v4-flash 로 옮기면서
  # 사고를 켜는 쪽으로 정했고, `noai50` 에서 실제로 나왔다 —
  # **사고 토큰 표본 120 · 중앙 198 · 최대 1183.**
  reasoning:
    effort: low
  # **끈다.** 사고형 모델이라 모델이 이미 생각하고 그것이 `api_reasoning` 으로 남는다.
  # 끄면 그 사고가 `reasonings` 스트림에 `source: "thinking"` 으로 들어가 지표 4 의 ①이
  # 계속 읽는다 (spec 12.1). **둘을 같이 켜면** 근거가 두 갈래로 와서 ①이 어느 쪽을
  # 읽을지 모호해진다.
  tool_reasoning: false
  # **도구 호출을 강제하지 않는다** (8/25). `"required"` 는 프로바이더 선택을 덮어쓴다 —
  # 같은 요청에서 `required` → Sail Research 21초 · 떼면 GMICloud 5.8초. `order` 에 적은
  # 세 업체 중 아무 곳도 오지 않았다.
  #
  # 강제는 **사고를 껐을 때** 넣은 우회책이었다 (8/16). 사고를 되켰으므로 숙고는
  # reasoning 채널로 가고, 안전망(`_recover_tool_calls` · `no_tool_call` 로그)은 그대로다.
  tool_choice: auto
  # **하나에 묶지 않는다** (8/25 · Eddie). `only: [DeepInfra]` 로 고정했더니 그 업체가
  # 막힌 날 런이 인질이 됐다 — 48콜에 429 여섯 · 90초 타임아웃 하나 · 토큰당 지연이
  # 건강할 때의 두 배(16 → 39 ms/tok)였다.
  #
  # 열일곱 업체가 이 모델을 서빙한다. **작은 프롬프트로 재면 안 된다** (8/26) — 실제
  # 콜은 입력 9천 토큰에 도구 9개다. 런에서 실제로 나간 요청을 그대로 3회씩 재쓴다.
  #
  #     업체          in$/1M  out$/1M  지연중앙  ms/tok  회차          양자
  #     StreamLake     0.083   0.165    5,204    17.7   22 16 18      fp8   ← 채택
  #     Parasail       0.140   0.280    5,418    17.6   18 17 18      fp8
  #     CoreWeave      0.140   0.280    6,874    21.5   21 24 21      fp8
  #     DeepInfra      0.090   0.180    8,493    27.1   25 29 27      fp8
  #     Alibaba        0.134   0.268    3,319    11.4   13 11 11      fp8
  #     GMICloud       0.084   0.168    8,196    14.5   (1회)         fp8  강등 -2
  #     Novita         0.140   0.280    5,338    13.8   (1회)         fp8
  #
  # **fp8 로 맞춘다** (8/26 · Eddie). 전 목록의 3순위 AtlasCloud 가 **fp4** 였다 —
  # 1·2순위가 같은 날 흔들리면 조용히 정밀도가 바뀐다. 번역기에서 죽인 혼입이 에이전트
  # 쪽에 그대로 남아 있었다. 지금까지 발동은 0건이었지만 발동하면 알아채기 어렵다.
  #
  # **GMICloud 를 뺀다** — OpenRouter 가 강등(`status: -2`)으로 찍었다. 실패로는 안
  # 나타났다(에러 0 · 재시도 0). 대신 트래픽이 2순위로 새고 그쪽이 두 배 느렸다:
  #
  #     260826-008  5해   GMICloud 33콜 10,892ms  ·  Novita 10콜 22,970ms (비중 23%)
  #
  # **Novita 도 뺀다** — GMICloud 의 1.67배다 (Eddie). Alibaba 는 가장 빠르지만 입력이
  # 같은 값이라 같은 이유로 뺀다. StreamLake 는 **fp8 최저가이면서** 그 둘만큼 빠르다.
  #
  # 8/25 에 적힌 「StreamLake 55.1 ms/tok」 은 그날의 상태다 — 오늘 3회 재서 17.7 이다.
  # **업체 속도는 날마다 바뀐다.** 이 표를 근거로 쓸 때는 날짜를 함께 본다.
  #
  # 「provider 에 따른 차이는 없다」 는 전제 아래에서만 섞을 수 있다 (Eddie 결정).
  # 실제로 어느 업체가 응답했는지는 `raw_calls.jsonl` 의 `response.provider` 에 남는다.
  # **폴백을 끈다** (8/26 · Eddie · 재현성). `allow_fallbacks: true` 는 「목록 밖으로도
  # 나갈 수 있다」 는 뜻이라 **고정이 아니라 선호**다. 오늘 실제로 샜다 —
  # `tool_choice: required` 일 때 목록에 없는 Sail Research 로 갔다.
  #
  #     없는 업체 + 폴백 켬   →  DigitalOcean     목록을 무시하고 아무 데나
  #     없는 업체 + 폴백 끔   →  HTTPError        시끄럽게 죽는다
  #     order 셋 + 폴백 끔    →  GMICloud         목록 **안에서** 순서대로
  #
  # 끄는 근거가 오늘 생겼다. 전에는 「그 업체가 막힌 날 런이 통째로 죽는다」 가 무서웠는데,
  # 429 폭풍 차단기(`rate_limit_abort`)와 매해 복원점이 들어왔으므로 이제 런은 **깨끗하게
  # 서고 이어진다.** 조용히 다른 업체로 새는 것보다 명백히 낫다 — 업체가 바뀌면 양자화가
  # 바뀌고, 그러면 같은 시드라도 다른 세계가 된다.
  provider:
    order: [StreamLake, DeepInfra, Parasail]   # 전부 fp8 · 도구·사고 실측 확인
    allow_fallbacks: false
  # **번역기는 따로, 그리고 더 좁게 고정한다** (8/26 · Eddie). 안 넘기고 있었더니
  # 375콜이 세 업체로 흩어졌고(DeepInfra 107 · Mistral 93 · Parasail 21) 429 가 154건
  # 났다. 재시도로 244통 중 221통을 회수했지만 23통(9.4%)이 죽었다.
  #
  # **429 보다 양자화가 문제다** — DeepInfra fp8 · Parasail bf16 · Mistral unknown.
  # 번역 왜곡이 종속변수이므로 그 생성기가 런 중간에 바뀌면 안 된다.
  #
  # 우선순위는 양자화가 같은 쪽부터다. **폴백은 끈다** (8/26 · 위 provider 참조) —
  # 여기가 특히 중요하다. 번역 왜곡이 **종속변수**이므로 생성기가 바뀌면 지표 4c·4d·7 이
  # 통째로 오염된다. 실측:
  #
  #     260826-002-ai010 번역 375콜
  #       DeepInfra 107 (fp8) · Mistral 93 (unknown) · Parasail 21 (bf16)
  #
  # **여기는 여유를 포기한다** (8/26 · Eddie · fp8 통일). 이 모델을 서빙하는 곳은 셋뿐이고
  # 양자화가 전부 다르다:
  #
  #     DeepInfra  fp8   ← 유일한 fp8
  #     Parasail   bf16
  #     Mistral    unknown
  #
  # 위 주석은 「양자화가 같은 쪽부터」 라고 적어 두고 **실제로는 셋을 섞고 있었다.**
  # 번역 왜곡이 종속변수이므로 생성기가 바뀌면 지표 4c·4d·7 이 오염된다 — 그러면 여유가
  # 있다는 것이 이득이 아니라 손해다.
  #
  # ⚠ **DeepInfra 가 막히면 런이 선다.** 실제로 8/26 에 429 3연발을 봤다. 그것이 옳은
  #   실패다 — 조용히 bf16 으로 새는 것보다 낫고, `rate_limit_abort` 와 매해 복원점이
  #   받아 준다. 대안이 필요하면 **번역 모델 자체를 바꿔야** 한다.
  translate_provider:
    # 전부 fp8 · 값싼 순. **Darkbloom 제외** — 혼자 fp4 라 섞이면 정밀도가 갈린다 (Eddie).
    order: [DeepInfra, Venice, AkashML, Parasail, AtlasCloud, Io Net]
    allow_fallbacks: false
  # **번역기는 사고를 끈다.** 위 translate_model 주석의 실측 참조 — 켜면 30배 느려지고
  # 번역은 그대로다. 에이전트의 `reasoning` 과 별개로 둔다 (그쪽은 사고가 자료다).
  translate_reasoning:
    enabled: false
  # **429 폭풍 차단기** (8/27 · Eddie). 코드 기본값 5 만 있고 yaml 에 없었다 —
  # 「숫자를 두 군데 적으면 하나가 낡는다」 의 반대 사고로, 여기 없으면 조절할 곳이
  # 없는 줄 알게 된다. 값을 올리며 함께 옮긴다.
  #
  # **5 는 너무 좁았다.** 260827-002-ai006 실측 (번역 요청 152건):
  #
  #     첫 시도 429      18건 (11.8%)
  #     재시도로 회수    13건
  #     끝내 실패         5건 (3.3%)  → 한도 5 도달, 18해에 런이 섰다
  #
  # 30해 완주에는 번역이 ~270건 필요하니 정상 변동만으로 ~9건이 나온다. 5 로는
  # 무조건 중간에 선다.
  #
  # **속도 제한이 아니라 간헐적 용량 부족이다.** 직접 재봤다 (8/27):
  #
  #     DeepInfra  간격 0s    10/10 성공     Parasail  간격 0s   0/10 (전부 429)
  #     DeepInfra  간격 0.5s   7/10 성공
  #
  # 쉬지 않고 부르면 다 받는데 간격을 두니 막혔다 — 우리 쪽 호출 속도로는 못 피한다.
  # 그리고 bf16 인 Parasail 은 아예 못 쓴다 (fp8 통일을 깨는 선택지조차 없다).
  #
  # 30 은 「정상 변동은 통과, 진짜 장애는 정지」 의 자리다. 업체가 죽으면 연속 실패라
  # 몇 해 안에 30 에 닿는다. 끝내 실패한 번역은 `meta.translate_failed` 로 남으므로
  # **손실이 세계의 사실로 섞이지 않는다** — 그래서 늘려도 자료가 안 상한다.
  rate_limit_abort: 30

run:
  seed: 1
