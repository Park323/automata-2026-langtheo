<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="920" height="620" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic','Helvetica Neue',sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9AA1AC"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="620" fill="#ffffff"/>

  <text x="40" y="44" font-size="20" font-weight="600" fill="#1B1F24">예산은 어디로 가는가 — 수혜 범위 × 수혜 시점</text>
  <text x="40" y="68" font-size="13" fill="#6B7280">세대 경계가 없습니다. 시점 축을 만드는 것은 세대가 아니라 수명의 유한성입니다 (기대 8.3턴 / 전체 50턴).</text>

  <!-- axes -->
  <line x1="150" y1="530" x2="860" y2="530" stroke="#9AA1AC" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="150" y1="530" x2="150" y2="110" stroke="#9AA1AC" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="860" y="558" font-size="13" fill="#4B5563" text-anchor="end">수혜 시점 →   지금 · 내가 사는 동안 · 내가 죽은 뒤 · 재앙 시</text>
  <text x="40" y="120" font-size="13" fill="#4B5563">수혜 범위 ↑</text>
  <text x="40" y="140" font-size="12" fill="#9AA1AC">나 → 계보 → 자국 → 세계</text>

  <!-- lane labels -->
  <text x="140" y="480" font-size="12" fill="#6B7280" text-anchor="end">나만</text>
  <text x="140" y="392" font-size="12" fill="#6B7280" text-anchor="end">내 계보</text>
  <text x="140" y="300" font-size="12" fill="#6B7280" text-anchor="end">자국 전원</text>
  <text x="140" y="200" font-size="12" fill="#6B7280" text-anchor="end">전 인류</text>

  <line x1="150" y1="440" x2="860" y2="440" stroke="#EEF0F3" stroke-width="1"/>
  <line x1="150" y1="350" x2="860" y2="350" stroke="#EEF0F3" stroke-width="1"/>
  <line x1="150" y1="252" x2="860" y2="252" stroke="#EEF0F3" stroke-width="1"/>

  <!-- wellness -->
  <rect x="185" y="452" width="190" height="56" rx="8" fill="#FDF2F2" stroke="#E5A3A3"/>
  <text x="200" y="476" font-size="14" font-weight="600" fill="#8C2F2F">invest: wellness</text>
  <text x="200" y="496" font-size="11.5" fill="#8C5050">수명 척도 λ 증가 · 확률적 · 비공개</text>

  <!-- procreate -->
  <rect x="400" y="364" width="200" height="56" rx="8" fill="#FBF4EC" stroke="#DDB784"/>
  <text x="415" y="388" font-size="14" font-weight="600" fill="#8A5B18">procreate</text>
  <text x="415" y="408" font-size="11.5" fill="#8A6A3C">즉시 사망 · 예산과 유언을 넘김</text>

  <!-- national -->
  <rect x="185" y="272" width="200" height="56" rx="8" fill="#F0F5FB" stroke="#9DB9DA"/>
  <text x="200" y="296" font-size="14" font-weight="600" fill="#1F4F86">invest: national</text>
  <text x="200" y="316" font-size="11.5" fill="#42607F">생산 배수 ↑ · 즉시 발현 · 확정</text>

  <!-- bunker -->
  <rect x="640" y="272" width="200" height="56" rx="8" fill="#F0F5FB" stroke="#9DB9DA"/>
  <text x="655" y="296" font-size="14" font-weight="600" fill="#1F4F86">facility — 벙커</text>
  <text x="655" y="316" font-size="11.5" fill="#42607F">자국민만 · 깊이 확률 · 자국에만</text>

  <!-- interceptor -->
  <rect x="640" y="172" width="200" height="56" rx="8" fill="#EEF7F0" stroke="#96C4A4"/>
  <text x="655" y="196" font-size="14" font-weight="600" fill="#1C6134">facility — 요격기</text>
  <text x="655" y="216" font-size="11.5" fill="#3F7554">전 인류 · 타국에도 낼 수 있음</text>

  <!-- coordination callout -->
  <path d="M600 200 L636 200" stroke="#96C4A4" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="390" y="172" width="205" height="56" rx="8" fill="#ffffff" stroke="#C7D3C9" stroke-dasharray="4 3"/>
  <text x="404" y="196" font-size="12.5" font-weight="600" fill="#3F7554">어느 나라에 낼지 합의</text>
  <text x="404" y="215" font-size="11.5" fill="#6B7280">어긋나면 진척이 쪼개진다 = 조율 실패</text>

  <!-- trap note -->
  <text x="640" y="348" font-size="11.5" fill="#8C2F2F">함정: 아무리 파도 100%에 닿지 않음</text>

  <!-- bottom note -->
  <line x1="150" y1="566" x2="860" y2="566" stroke="#EEF0F3"/>
  <text x="150" y="590" font-size="12" fill="#6B7280">사적 재화는 행복이 아니라 <tspan font-weight="600" fill="#8C2F2F">수명</tspan>입니다. 수명은 예산과 AP 의 총량을 정하는 상위 자원이고, 그래서 공공 투자와 정면으로 경쟁합니다.</text>
  <text x="150" y="610" font-size="12" fill="#6B7280">warm glow(즉시 보람)는 폐지했습니다 — 공공 투자에 보상을 얹으면 목적함수를 주는 것이 됩니다. 공공 투자의 보상은 실제 효과뿐입니다.</text>
</svg>
