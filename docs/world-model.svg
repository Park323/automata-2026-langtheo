<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" width="920" height="600" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic','Helvetica Neue',sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9AA1AC"/>
    </marker>
    <marker id="ahw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C2833B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="600" fill="#FCFCFD"/>
  <rect x="0.5" y="0.5" width="919" height="599" fill="none" stroke="#E4E7EB"/>

  <text x="40" y="42" font-size="19" font-weight="700" fill="#1F2933">예산은 어디로 가는가 — 수혜 범위 × 수혜 시점</text>
  <text x="40" y="63" font-size="13" fill="#7B8794">네 갈래가 같은 예산을 두고 경합한다. 공공재는 전부 즉시 소량의 보람을 돌려준다.</text>

  <!-- axes -->
  <line x1="115" y1="500" x2="115" y2="78" stroke="#C6CBD1" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="115" y1="500" x2="878" y2="500" stroke="#C6CBD1" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="70" y="88" font-size="12" font-weight="600" fill="#7B8794">수혜 범위</text>
  <text x="856" y="522" font-size="12" font-weight="600" fill="#7B8794" text-anchor="end">수혜 시점</text>

  <!-- y ticks -->
  <text x="103" y="145" font-size="13" fill="#52606D" text-anchor="end">전 인류</text>
  <text x="103" y="285" font-size="13" fill="#52606D" text-anchor="end">우리 나라</text>
  <text x="103" y="425" font-size="13" fill="#52606D" text-anchor="end">나</text>
  <line x1="110" y1="140" x2="120" y2="140" stroke="#C6CBD1"/>
  <line x1="110" y1="280" x2="120" y2="280" stroke="#C6CBD1"/>
  <line x1="110" y1="420" x2="120" y2="420" stroke="#C6CBD1"/>

  <!-- x ticks -->
  <text x="215" y="526" font-size="13" fill="#52606D" text-anchor="middle">지금</text>
  <text x="475" y="526" font-size="13" fill="#52606D" text-anchor="middle">다음 세대</text>
  <text x="735" y="526" font-size="13" fill="#52606D" text-anchor="middle">재앙 시</text>
  <line x1="215" y1="495" x2="215" y2="505" stroke="#C6CBD1"/>
  <line x1="475" y1="495" x2="475" y2="505" stroke="#C6CBD1"/>
  <line x1="735" y1="495" x2="735" y2="505" stroke="#C6CBD1"/>

  <!-- 개인 소비 -->
  <rect x="130" y="389" width="170" height="62" rx="9" fill="#F0F2F5" stroke="#8A94A2" stroke-width="1.6"/>
  <text x="215" y="414" font-size="15" font-weight="700" fill="#323F4B" text-anchor="middle">개인 소비</text>
  <text x="215" y="434" font-size="11.5" fill="#7B8794" text-anchor="middle">확정 · 즉시 · 나만</text>

  <!-- 국가 투자 -->
  <rect x="390" y="249" width="170" height="62" rx="9" fill="#E6F4F1" stroke="#0F766E" stroke-width="1.6"/>
  <text x="475" y="274" font-size="15" font-weight="700" fill="#0B5E57" text-anchor="middle">국가 투자</text>
  <text x="475" y="294" font-size="11.5" fill="#3F7F78" text-anchor="middle">확정 · 다음 세대부터</text>
  <text x="475" y="333" font-size="11.5" fill="#0F766E" text-anchor="middle">생산 배수 ↑ · 후손 초기 행복 ↑</text>

  <!-- 벙커 -->
  <rect x="650" y="249" width="170" height="62" rx="9" fill="#FBF0E1" stroke="#B45309" stroke-width="1.6"/>
  <text x="735" y="274" font-size="15" font-weight="700" fill="#8A400A" text-anchor="middle">벙커</text>
  <text x="735" y="294" font-size="11.5" fill="#9B6B33" text-anchor="middle">자국민만 생존</text>

  <!-- 요격기 -->
  <rect x="650" y="109" width="170" height="62" rx="9" fill="#E8EEFC" stroke="#1D4ED8" stroke-width="1.6"/>
  <text x="735" y="134" font-size="15" font-weight="700" fill="#173FA6" text-anchor="middle">요격기</text>
  <text x="735" y="154" font-size="11.5" fill="#4A6BC4" text-anchor="middle">전 인류 생존 · 확률적</text>
  <text x="635" y="128" font-size="11.5" fill="#4A6BC4" text-anchor="end">3국 전체가 내야</text>
  <text x="635" y="146" font-size="11.5" fill="#4A6BC4" text-anchor="end">임계에 도달한다</text>

  <!-- 국토 배타 badge -->
  <line x1="735" y1="171" x2="735" y2="192" stroke="#A0A8B3" stroke-width="1.3" stroke-dasharray="3 3"/>
  <line x1="735" y1="228" x2="735" y2="249" stroke="#A0A8B3" stroke-width="1.3" stroke-dasharray="3 3"/>
  <rect x="642" y="192" width="186" height="36" rx="7" fill="#FFFFFF" stroke="#A0A8B3" stroke-width="1.2"/>
  <text x="735" y="209" font-size="11.5" font-weight="600" fill="#52606D" text-anchor="middle">국토 배타 — 둘 중 하나만</text>
  <text x="735" y="223" font-size="10.5" fill="#8A94A2" text-anchor="middle">전환 시 매몰비용 전액 소실</text>

  <!-- warm glow -->
  <path d="M475,311 V468" fill="none" stroke="#C2833B" stroke-width="1.4" stroke-dasharray="4 4"/>
  <path d="M735,311 V468" fill="none" stroke="#C2833B" stroke-width="1.4" stroke-dasharray="4 4"/>
  <path d="M650,140 H600 V468" fill="none" stroke="#C2833B" stroke-width="1.4" stroke-dasharray="4 4"/>
  <path d="M735,468 H215 V458" fill="none" stroke="#C2833B" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#ahw)"/>
  <rect x="322" y="475" width="196" height="20" rx="5" fill="#FCFCFD"/>
  <text x="420" y="490" font-size="11.5" font-weight="600" fill="#B0752F" text-anchor="middle">즉시 보람 (warm glow)</text>

  <!-- legend -->
  <text x="40" y="566" font-size="11.5" fill="#7B8794">공공재 투자는 궁극 수혜가 미래·타인에게 가지만, 투자 즉시 소량의 행복을 돌려준다.</text>
  <text x="40" y="583" font-size="11.5" fill="#7B8794">이것이 없으면 아무도 투자하지 않는 것이 지배 전략이 되어, 조율 실패를 관측할 기회 자체가 사라진다.</text>
</svg>
