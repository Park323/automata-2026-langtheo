<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>langtheo — ボード</title>
<style>
  :root{ --ja:#e8a33d; --zh:#e05561; --fr:#5b9df9;
    --ink:#e6edf3; --dim:#8b95a3; --line:#26324c; --panel:#0f1524; }
  *{box-sizing:border-box}
  /* 우주 배경 — 운석이 다가올수록 불길하게 물든다 */
  #space{position:fixed;inset:0;z-index:0;background:#000;transition:background 1.2s ease}
  /* 운석 — 암석이 굴러 내려온다 */
  /* 엔딩 연출 — 폭발 섬광 · 요격 빔 · 배너 */
  #flash{position:fixed;inset:0;z-index:14;pointer-events:none;opacity:0;
    background:radial-gradient(circle at 50% 58%, rgba(255,245,210,1) 0%, rgba(255,150,50,.85) 18%, rgba(255,60,20,0) 52%)}
  #flash.boom{animation:boom 1.6s ease-out forwards}
  #flash.blue{background:radial-gradient(circle at 50% 58%, rgba(220,245,255,1) 0%, rgba(120,210,255,.85) 18%, rgba(60,140,255,0) 52%)}
  @keyframes boom{0%{opacity:0;transform:scale(.15)}12%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.7)}}
  #beam{position:fixed;z-index:13;pointer-events:none;opacity:0;transform-origin:center bottom;
    background:linear-gradient(0deg, rgba(150,230,255,0), rgba(150,230,255,.9) 40%, #fff);
    box-shadow:0 0 26px 10px rgba(120,210,255,.85);border-radius:8px}
  #beam.fire{animation:beamfire .9s ease-out forwards}
  @keyframes beamfire{0%{opacity:0;transform:scaleY(0)}25%{opacity:1;transform:scaleY(1)}80%{opacity:1}100%{opacity:0}}
  #endbanner{position:fixed;left:50%;top:36%;transform:translate(-50%,-50%);z-index:16;pointer-events:none;
    font-size:46px;font-weight:900;opacity:0;text-shadow:0 4px 22px #000,0 0 30px currentColor;text-align:center;white-space:nowrap}
  #endbanner.show{animation:endshow 2.4s ease-out forwards}
  @keyframes endshow{0%{opacity:0;transform:translate(-50%,-50%) scale(.55)}22%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}35%{transform:translate(-50%,-50%) scale(1)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
  /* 지구는 별도 뒷층 (운석이 지구 앞·패널 뒤에 오게) */
  #backlayer{position:fixed;inset:0;z-index:1;pointer-events:none;
    transform-origin:left center;transition:transform .3s ease}
  #meteor{position:fixed;z-index:2;pointer-events:none;   /* 지구 앞 · 패널/화살표 뒤 */
    transition:left .6s ease, top .6s ease, width .6s ease, height .6s ease}
  #rock{width:100%;height:100%;position:relative;z-index:1;animation:roll 9s linear infinite}
  #rock img{width:100%;height:100%;display:block;object-fit:contain;filter:drop-shadow(0 0 10px rgba(255,150,50,.6))}
  @keyframes roll{to{transform:rotate(360deg)}}
  /* 꼬리 — 진행 반대쪽(위-오른쪽)으로 뻗는 불꽃 띠 */
  #trail{position:absolute;left:50%;top:50%;width:260%;height:30%;z-index:0;
    transform-origin:left center;transform:translateY(-50%) rotate(-64deg);
    background:linear-gradient(90deg, rgba(255,225,130,.9) 0%, rgba(255,150,40,.5) 45%, rgba(255,120,30,0) 100%);
    filter:blur(6px);border-radius:50%}
  html,body{margin:0;height:100%;background:#000;color:var(--ink);
    font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden}

  /* 흐름 오버레이 */
  #flow{position:fixed;inset:0;z-index:5;pointer-events:none}
  /* 나라 패널 */
  #stage{position:fixed;inset:0;z-index:3;transform-origin:left center;
    transition:transform .3s ease;will-change:transform}
  /* 가운데 지구 — 크게, 위쪽 곡면만 보이고 나라들이 그 위에 앉는다 (아래는 화면 밖) */
  .globe{position:absolute;transform:translate(-50%,-50%);border-radius:50%;
    width:min(1120px,96vw);height:min(1120px,96vw);
    background:transparent url('planet.png') center / cover no-repeat}
  /* 대륙 위 시설 마커 (진척 링 + 아이콘) */
  .cmark{position:absolute;transform:translate(-50%,-50%);text-align:center;pointer-events:none;
    filter:drop-shadow(0 3px 8px rgba(0,0,0,.7))}
  .cring{width:72px;height:72px;border-radius:50%;position:relative;display:grid;place-items:center;margin:0 auto;
    background:conic-gradient(var(--c) calc(var(--p)*3.6deg), rgba(0,0,0,.5) 0);
    box-shadow:0 0 0 2px rgba(0,0,0,.4), 0 0 16px var(--c)}
  /* 소유국 색을 옅게 깐다 (8/28 · Eddie) — 링만 봐도 누구 시설인지 읽히게 */
  .cring::before{content:"";position:absolute;inset:8px;border-radius:50%;
    background:linear-gradient(var(--own,transparent),var(--own,transparent)), rgba(10,26,20,.88)}
  .cicon{position:relative;font-size:30px;z-index:1}
  .clabel{font-size:14px;font-weight:800;margin-top:4px;text-shadow:0 1px 4px #000,0 0 8px #000}
  /* 국적은 여기서 말한다 — **아주 옅게**. 토큰에서 색 테두리를 걷어낸 자리를 받는다 */
  .nation{position:absolute;transform:translate(-50%,-50%);width:400px;
    background:linear-gradient(var(--tint), var(--tint)), rgba(15,21,36,.8);
    backdrop-filter:blur(3px);
    border:1px solid var(--k, var(--line));border-radius:16px;padding:16px 18px 18px}
  .nhead{display:flex;align-items:center;gap:9px;margin-bottom:10px}
  /* 이름표가 아래로 — 위를 비워 나라 사이 화살표가 지나가게 한다 */
  .nation.headfoot{display:flex;flex-direction:column}
  .nation.headfoot .nhead{order:9;margin:10px 0 0}
  .ndot{width:13px;height:13px;border-radius:50%;box-shadow:0 0 10px currentColor}
  .nname{font-weight:700;font-size:17px}
  /* 생산 배수 — 관전자 전용 상수. 세계 안 누구도 모르는 값이라 title 로 그 사실을 밝힌다 */
  .nmult{font-size:12px;font-weight:800;color:var(--dim);border:1px solid var(--line);
    border-radius:6px;padding:1px 6px;letter-spacing:.02em;cursor:help}
  .nland{margin-left:auto;font-size:11px;color:var(--dim);border:1px solid var(--line);
    border-radius:999px;padding:2px 9px}
  /* 진척 바 */
  .prow{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin:2px 2px 4px}
  .prow .dlt{color:#7ee39a;font-weight:700}
  .bar{height:10px;border-radius:6px;background:#0b1120;border:1px solid var(--line);overflow:hidden}
  .bar>i{display:block;height:100%;width:0;border-radius:6px;transition:width .4s ease}
  /* 투표·국토 알림 */
  .vnotes{margin:4px 0 2px}
  .vnote{font-size:11px;border-radius:7px;padding:3px 8px;margin-top:4px;display:block;
    border:1px solid var(--line);background:#12213a;color:#cdd6e4}
  .vnote.land{color:#7fe0ff;border-color:#2b6f8a;background:#0e2530}
  .vnote.land.lost{color:#ffb0b0;border-color:#7a2b2b;background:#241316}
  .vnote .lost{color:#ff8a8a;font-weight:700;margin-left:4px}
  /* 사망 알림 */
  .deaths{margin-top:8px;min-height:0}
  .death{font-size:11px;color:#ff8a8a;background:#241316;border:1px solid #5a2b2b;
    border-radius:7px;padding:3px 7px;margin-top:4px;display:inline-block}
  .agents{position:relative;height:250px;margin-top:8px}
  .agent{position:absolute;text-align:center;width:76px}
  /* **평상시에는 테두리가 없다** (8/27 · Eddie). 아홉 명 모두에 색 테두리를 두르면
     한 칸씩 짚어 볼 때 **누가 지금 움직이는지**가 안 보인다. 국적은 국가 패널의
     옅은 색이 말하고, 테두리는 **지금 행위자**에게만 준다. */
  .tok{width:60px;height:60px;margin:0 auto;border-radius:50%;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;color:#fff;
    border:3px solid transparent;background:#131c2b;
    transition:transform .15s, border-color .12s, box-shadow .12s}
  .tok:hover{transform:scale(1.08);border-color:#ffffff33}
  /* 지금 움직이는 사람 — 굵고 밝게 */
  .tok.acting{border-color:#fff;
    box-shadow:0 0 0 4px rgba(255,255,255,.28), 0 0 26px rgba(255,255,255,.55);
    transform:scale(1.10)}
  .agent.dead{opacity:.28}
  .agent.dead .tok{filter:grayscale(1)}
  .agent.born .tok{border-color:#3fb95088;box-shadow:0 0 14px rgba(63,185,80,.35)}
  .asub{font-size:12px;color:#c3ccda;margin-top:6px}
  .asub .new{color:#7ee39a;font-weight:700}
  /* 쓸 수 있는 언어 점 — 사람(토큰) 위에 */
  .pips{position:absolute;top:-5px;left:50%;transform:translateX(-50%);display:flex;gap:3px}
  .pips i{width:10px;height:10px;border-radius:50%;border:1.5px solid #0b1120;box-shadow:0 0 6px currentColor}
  /* 학습 진척 */
  .learn{margin-top:5px;font-size:10px;color:#ffd24a}
  .lbar{height:5px;width:56px;margin:2px auto 0;border-radius:4px;background:#0b1120;border:1px solid #4a3d12;overflow:hidden}
  .lbar>i{display:block;height:100%;background:#ffd24a}
  /* 메모 버튼 */
  .memo{margin-top:5px;font-size:11px;cursor:pointer;background:#132038;border:1px solid var(--line);
    border-radius:7px;padding:2px 7px;color:#bcd2ff}
  .memo:hover{border-color:#3a557f}
  /* 유언 버튼 (사망 알림 안) */
  .will{cursor:pointer;text-decoration:underline;color:#ffd0d0}
  /* 모달 */
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;
    justify-content:center;z-index:50}
  #modal[hidden]{display:none}
  .mcard{width:min(560px,92vw);max-height:74vh;background:#0f1524;border:1px solid var(--line);
    border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .mhead{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700}
  .mhead button{margin-left:auto;background:#16213a;color:var(--ink);border:1px solid var(--line);
    border-radius:8px;padding:4px 10px;cursor:pointer}
  #mbody{padding:14px 16px;overflow:auto;line-height:1.6;font-size:13.5px;color:#dbe3ef}
  #mbody .dsec{margin-bottom:14px}
  #mbody .dsec h4{margin:0 0 6px;font-size:12px;color:var(--dim);font-weight:700;
    text-transform:none;border-bottom:1px solid var(--line);padding-bottom:4px}
  #mbody .drow{padding:5px 8px;margin-bottom:5px;background:#0b1120;border:1px solid var(--line);border-radius:8px}
  #mbody .drow.foreign{border-color:#8a3f66}
  #mbody .drow.own{border-color:#2b6f8a}
  #mbody .gain{color:#7ee39a;font-weight:700;margin-left:6px}
  #mbody .txt{white-space:pre-wrap;margin-top:3px;color:#c9d3e2;font-size:13px}
  #mbody .tag{font-size:10px;padding:1px 6px;border-radius:6px;border:1px solid var(--line);margin-left:5px;color:var(--dim)}
  #mbody .tag.ai{color:#c9a9ff;border-color:#5a3f8a}
  #mbody .tag.original{color:#9be7b3;border-color:#2f6a45}
  /* 사이드 패널 (사람 집중) */
  #side{position:fixed;top:0;right:0;width:380px;height:100%;z-index:30;
    background:#0d1320f2;border-left:1px solid var(--line);backdrop-filter:blur(8px);
    display:flex;flex-direction:column;box-shadow:-14px 0 40px rgba(0,0,0,.5);
    transform:translateX(0);transition:transform .3s ease}
  #side[hidden]{display:flex;transform:translateX(100%)}   /* 닫히면 오른쪽으로 스르륵 */
  .shead{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
  #stitle{font-weight:700;font-size:15px}
  .shead button{margin-left:auto;background:#16213a;color:var(--ink);border:1px solid #3a557f;
    border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px}
  #sbody{padding:14px 16px;overflow:auto;flex:1;font-size:13.5px;line-height:1.6;color:#dbe3ef}
  #sbody .dsec{margin-bottom:14px}
  #sbody .dsec h4{margin:0 0 6px;font-size:12px;color:var(--dim);font-weight:700;border-bottom:1px solid var(--line);padding-bottom:4px}
  #sbody .drow{padding:6px 9px;margin-bottom:5px;background:#0b1120;border:1px solid var(--line);border-radius:8px}
  #sbody .drow.foreign{border-color:#8a3f66}
  #sbody .drow.own{border-color:#2b6f8a}
  #sbody .gain{color:#7ee39a;font-weight:700;margin-left:6px}
  #sbody .txt{white-space:pre-wrap;margin-top:3px;color:#c9d3e2;font-size:13px}
  #sbody .tag{font-size:10px;padding:1px 6px;border-radius:6px;border:1px solid var(--line);margin-left:5px;color:var(--dim)}
  #sbody .tag.ai{color:#c9a9ff;border-color:#5a3f8a}
  #sbody .tag.original{color:#9be7b3;border-color:#2f6a45}
  /* 선택된 사람 */
  /* **골라 본 사람**과 **지금 움직이는 사람**은 달라야 한다 (8/27). 둘 다 흰 테두리라
     한 칸씩 짚을 때 구분이 안 됐다. 선택은 호박색 점선, 행위는 흰 실선. */
  .tok.sel{border-style:dashed;border-color:#ffcf7a!important;
    box-shadow:0 0 0 3px rgba(255,207,122,.25),0 0 20px rgba(255,207,122,.45)}
  .tok.sel.acting{border-style:solid;border-color:#fff!important;
    box-shadow:0 0 0 4px rgba(255,207,122,.35),0 0 26px rgba(255,255,255,.6)}

  /* 하단 컨트롤 */
  #dock{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:20;
    display:flex;gap:12px;align-items:center;background:#0f1524cc;border:1px solid var(--line);
    border-radius:14px;padding:10px 14px;backdrop-filter:blur(6px)}
  #dock button{background:#16213a;color:var(--ink);border:1px solid var(--line);
    border-radius:9px;padding:7px 12px;font-size:15px;cursor:pointer}
  #dock button:hover{border-color:#3a557f}
  #scrub{width:min(44vw,520px);accent-color:var(--fr)}
  #dock select{background:#16213a;color:var(--ink);border:1px solid var(--line);
    border-radius:9px;padding:6px 8px;font-size:13px;cursor:pointer}
  #dock .yr{font-variant-numeric:tabular-nums;font-size:14px;min-width:64px;text-align:center}

  /* 필터 */
  #filters{position:fixed;top:14px;right:16px;z-index:20;display:flex;gap:8px}
  #filters button{background:#0f1524cc;color:var(--dim);border:1px solid var(--line);
    border-radius:9px;padding:6px 11px;font-size:12px;cursor:pointer;backdrop-filter:blur(6px)}
  #filters button.on{color:var(--ink);border-color:#3a557f;background:#16213a}
  /* 선 범례 */
  /* 화살표 클릭 팝업 (8/28) */
  .pmsg{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;background:#0b1120}
  .pmsg .phead{font-size:12px;color:var(--dim);margin-bottom:6px}
  .pmsg .ptext{font-size:14px;line-height:1.55;white-space:pre-wrap}
  .pmsg .ptr{font-size:13px;color:#ff9e3d;margin-top:6px;line-height:1.5;white-space:pre-wrap}
  /* 좌측 상단 빈 자리에 **가로로 넓게** (8/28 · Eddie) — 세로 기둥은 시선이 오르내려야
     읽혔다. HUD(연도·카운트다운) 바로 아래 한 줄로 눕힌다. */
  /* 폭을 좁혀 자연히 두 줄로 — 한 줄은 너무 길었다 (8/28) */
  #legend{position:fixed;left:16px;top:56px;z-index:20;display:flex;flex-wrap:wrap;
    align-items:center;column-gap:14px;row-gap:7px;max-width:min(46vw,520px);
    background:#0f1524cc;border:1px solid var(--line);border-radius:12px;padding:8px 14px;backdrop-filter:blur(6px)}
  #legend span{display:flex;align-items:center;gap:7px;font-size:11.5px;color:#c3ccda;white-space:nowrap}
  #legend i{width:22px;height:3px;border-radius:2px;flex:none}
  /* 점선 색을 초록으로 **고정**하고 있었다 — 색은 각 줄이 정한다. */
  #legend i.dash{background:none!important;border-top:3px dashed;height:0}
  #legend b{font-size:10px;color:#7e8ba3;letter-spacing:.08em;margin:0 2px 0 6px}
  #legend b:first-child{margin-left:0}
  #legend .marks{gap:5px;font-size:11px;color:#9fb0c9}
  #legend .marks em{font-style:normal;font-size:13px;margin-left:5px}
  #legend .marks em:first-child{margin-left:0}
  /* 採決의 해 — 국가 패널 **위에** 붙는 서브 블럭 (8/27 · Eddie).
     패널이 `position:absolute` 라 `bottom:100%` 로 그 위에 얹힌다. */
  .ballotbar{position:absolute;left:0;right:0;bottom:calc(100% + 10px);
    background:#12203a;border:2px solid #4a8cff;border-radius:14px;
    padding:10px 14px 12px;box-shadow:0 0 22px rgba(74,140,255,.35);text-align:center}
  .ballotbar.below{bottom:auto;top:calc(100% + 10px)}
  /* 해 끝 사건 — 그 해의 행위가 다 흐른 뒤에 나타난다 */
  .vnote.land,.deaths{opacity:0;transition:opacity .25s}
  #stage.yearend .vnote.land,#stage.yearend .deaths{opacity:1}
  .bhead{font-size:15px;font-weight:800;color:#9fc6ff;letter-spacing:.03em}
  .btally{display:flex;justify-content:center;gap:18px;margin-top:6px;
    font-size:15px;font-weight:700}
  .btally b{font-size:19px;margin-left:5px}
  .btally .bi{color:#7fe0ff} .btally .bb{color:#ffcf7a} .btally .ba{color:#8b949e}
  /* 그 해에 던진 표 · 採決 알림 · 국토 결정과 전환의 구분 (8/27) */
  .bal{font-size:10px;margin-top:2px;padding:1px 5px;border-radius:6px;white-space:nowrap;
       border:1px solid currentColor;opacity:.9;transition:opacity .2s,transform .2s}
  .bal.interceptor{color:#7fe0ff} .bal.bunker{color:#ffcf7a} .bal.abstain{color:#8b949e}
  /* **표는 던지는 순간에 나타난다** (8/28 · Eddie). 그 해 처음부터 떠 있으면 위의 집계는
     한 장씩 올라가는데 아래 뱃지는 이미 다 나와 있어, 둘이 서로 다른 시점을 가리킨다. */
  .bal.pending{opacity:0;transform:translateY(-3px)}
  .btally b{display:inline-block;transition:transform .18s}
  .btally b.bump{transform:scale(1.5)}
  .vnote.first{opacity:.7}
  .vnote .kept{color:#3fb950;margin-left:4px}
  #hud{position:fixed;top:14px;left:16px;z-index:20;font-size:13px;color:var(--dim);
    display:flex;gap:14px;align-items:center}
  #hud b{color:var(--ink)}
  #hud .chip{background:#1a0e0e;border:1px solid #5a2b2b;border-radius:9px;padding:3px 10px}
  #hud .chip.warn{color:#ff9a6a}
  #hud .chip.warn b{color:#ffcaa0;font-size:15px}
  #hud .lg{display:inline-flex;align-items:center;gap:5px}
  #hud .lg i{width:10px;height:10px;border-radius:50%;box-shadow:0 0 6px currentColor}
  #drop{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:14px;color:var(--dim);background:#000}
  #drop button{background:#16213a;color:var(--ink);border:1px solid var(--line);
    border-radius:10px;padding:9px 16px;font-size:14px;cursor:pointer}
</style>
</head>
<body>
<svg id="flow"></svg>

<div id="filters">
  <button id="f-invest" class="on">🎯 投資</button>
  <button id="f-msg" class="on">💬 会話</button>

<script>
const $=s=>document.querySelector(s);
const NATLANG={Asla:"ja", Ranoa:"zh", Miris:"fr"};
const LANGNAT={ja:"Asla", zh:"Ranoa", fr:"Miris"};   // 언어 → 나라 이름
const HEX={ja:"#e8a33d", zh:"#e05561", fr:"#5b9df9"};
const langName=l=>(LANGNAT[l]||l)+"語";
// 삼각 배치: Ranoa 위, Asla 좌하, Miris 우하
const POS={ Ranoa:{x:.50,y:.28}, Asla:{x:.18,y:.52}, Miris:{x:.82,y:.52} };
// 대륙 중심 (지구 이미지 내부 % 좌표) — 나라와 짝
const CONT={ Ranoa:[50,35], Asla:[34,51], Miris:[66,51] };
const NAMES=["state.jsonl","metrics.jsonl","events.jsonl","messages.jsonl","config_snapshot.yaml","summary.json"];
const natOf=a=>String(a).replace(/\d+$/,"");
// 지구 대륙 (울퉁불퉁한 땅 모양, 구에 클립)
const GLOBE_SVG=`<svg viewBox="0 0 100 100" preserveAspectRatio="none">
  <defs>
    <clipPath id="gclip"><circle cx="50" cy="50" r="50"/></clipPath>
    <linearGradient id="gland" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#43ab68"/><stop offset="1" stop-color="#1f6a3e"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#gclip)" fill="url(#gland)" stroke="#6fd49a" stroke-width="0.5" stroke-opacity="0.4">
    <path d="M28,17 C31,10 41,8 47,11 C52,7 61,8 63,14 C69,13 74,18 71,23 C75,27 71,33 65,31 C62,36 54,35 50,31 C45,35 37,33 35,27 C29,28 24,23 28,18 C25,18 25,17 28,17 Z"/>
    <path d="M11,41 C13,33 22,31 28,34 C34,30 42,33 43,40 C48,42 47,50 41,52 C43,58 33,60 28,54 C22,58 13,55 12,48 C7,47 6,41 11,41 Z"/>
    <path d="M58,39 C60,31 69,29 75,32 C81,28 89,31 90,38 C95,41 93,49 87,49 C88,55 78,57 73,51 C67,55 58,53 57,46 C52,45 53,39 58,39 Z"/>
  </g>
</svg>`;

let D=null, turn=1, playing=false;
let showMsg=true, showInvest=true, focusAgent=null;   // 필터·집중

function jsonl(t){ return (t||"").split("\n").filter(Boolean).map(l=>{try{return JSON.parse(l)}catch{return null}}).filter(Boolean); }

async function readFetch(run){
  const files={};
  await Promise.all(NAMES.map(async n=>{
    try{ const r=await fetch(`../runs/${run}/${n}?t=${Date.now()}`,{cache:"no-store"});
      if(r.ok) files[n]=await r.text(); }catch(e){}
  }));
  return files;
}

function build(files){
  const state=jsonl(files["state.jsonl"]);
  const metrics=jsonl(files["metrics.jsonl"]);
  const events=jsonl(files["events.jsonl"]);
  const messages=jsonl(files["messages.jsonl"]);
  const turns=Math.max(1,...state.map(s=>s.turn));
  const byTurn={};
  for(let t=1;t<=turns;t++) byTurn[t]={agents:{},nations:{},births:new Set(),deaths:[],flows:[],
    succ:{},lands:[],ballotDay:new Set(),ballots:{}};
  state.forEach(s=>{ if(byTurn[s.turn]) byTurn[s.turn].agents[s.agent]=s; });
  metrics.forEach(m=>{ if(byTurn[m.turn]) byTurn[m.turn].nations=m; });
  events.forEach(e=>{ const b=byTurn[e.turn]; if(!b) return;
    if(e.type==="birth") b.births.add(e.id);
    else if(e.type==="death"){ b.deaths.push({who:e.who, born:e.born, age:e.age, country:e.country});
      b.succ[e.who]=e.born;     // 그 해에 죽은 행위자 → 후손(같은 자리)
      // **죽음과 계승도 그 해의 행위다** (8/28 · Eddie). 전에는 패널 구석의 글줄로만
      // 남아서, 사람이 바뀐 해인지 흘려 보면 몰랐다. 정산에서 일어나는 일이므로
      // `seq` 를 그 해 밖으로 크게 잡아 **행위가 다 흐른 뒤 맨 끝**에 세운다.
      b.flows.push({kind:"succeed", from:e.who, to:e.born, age:e.age, country:e.country,
        seq:1e9+b.flows.length}); }
    else if(e.type==="land_change" && e.changed) b.lands.push({country:e.country, chosen:e.chosen,
      from:e.from, counts:e.counts||{}, lost:e.progress_lost||0, kept:e.progress_kept||0});
    // **採決은 시계가 연다** — 소집자가 없다. `by` 는 언제나 null 이고 유예도 없다.
    else if(e.type==="vote" && e.kind==="propose" && e.opened!==false)
      b.ballotDay.add(e.country);
    // 개별 표. 採決이 주기로 돌아오므로 「누가 무엇에 던졌나」 가 계속 갱신된다
    else if(e.type==="vote" && e.kind==="ballot"){ b.ballots[e.by]=e.choice;
      b.flows.push({kind:"act", act:"vote", from:e.by, seq:e.seq, choice:e.choice}); }
    // **파괴는 투자가 아니다** — 부호가 반대인 행위라 같은 화살표로 그리면 거짓이다
    // **행위인데 차례가 없었다** (8/27 · Eddie). 학습·관측·표가 그 해 처음부터 떠
    // 있었다. `seq` 가 붙었으므로 투자·대화와 같은 줄에 세운다 — 화살표는 없고
    // 그 사람 토큰에 흰 테두리만 옮겨 온다.
    // 지불 한 번(`kind` 없음)도 취득(`acquired`)도 다 행위다
    else if(e.type==="learn")
      b.flows.push({kind:"act", act:"learn", from:e.agent, seq:e.seq, lang:e.lang});
    else if(e.type==="risk_observe")
      b.flows.push({kind:"act", act:"observe", from:e.agent, seq:e.seq});
    else if(e.type==="facility_gain") b.flows.push({kind:e.kind==="destroy"?"destroy":"invest",
      from:e.agent, toNat:e.to, seq:e.seq,
      foreign: natOf(e.agent)!==e.to, amount:e.amount, gain:e.gain}); });
  // 대화 = 메시지 (개인 → 개인) — 내용도 담는다
  messages.forEach(m=>{ const b=byTurn[m.turn]; if(!b) return;
    const meta=m.meta||{};
    // **무슨 말로 썼나** (8/28 · Eddie). 로그에 쓴 언어 필드가 따로 없어 글자로 판별한다
    // — 가나가 있으면 ja, 한자만 있으면 zh, 아니면 fr. 세 언어뿐이라 이걸로 충분하다.
    const tw=(meta.text_written||meta.text_sent||"").trim();
    const wlang=/[\u3040-\u30ff]/.test(tw)?"ja":/[\u4e00-\u9fff]/.test(tw)?"zh":"fr";
    b.flows.push({kind:"msg", from:m.from, to:m.to, route:m.route, seq:m.seq,
      text:(meta.text_delivered||meta.text_sent||"").trim(),
      tw, tdel:(meta.text_delivered||"").trim(), delivered:m.delivered,
      wforeign: wlang!==NATLANG[natOf(m.from)]}); });
  // **차례를 썼는데 화면이 비던 해** (8/28 · Eddie). 「현재 턴인 애한테 불만은 들어오는데
  // 행동이 없는 때가 있다」 — 맞았고, 짚은 원인(메모 쓰기)도 맞았다.
  //
  // `events.jsonl` 에 남는 것은 **성공한 바깥 행위**뿐이다. 그 해 실측으로
  // 메모 쓰기 90건 · 실패한 투자 92건 · 실패한 대화 78건이 아무 자국도 남기지 않았다.
  // 말을 듣고 메모만 적고 끝낸 사람은 보드에서 그 차례가 통째로 사라져, 「불만은
  // 들어오는데 아무것도 안 한 사람」 으로 보였다.
  //
  // `agent_turn.reasonings` 가 그 차례에 부른 도구를 **순서대로** 갖고 있다. 기록에
  // 남은 행위와 앞에서부터 맞춰 가며, 사이에 낀 것들에 그 직전 `seq` 의 소수 자리를
  // 준다 — 순서는 지키되 기록된 행위의 자리를 밀지 않는다.
  const TOOLED={speak:1, observe_risk:1, learn:1, vote:1};
  events.filter(e=>e.type==="agent_turn").forEach(e=>{
    const b=byTurn[e.turn]; if(!b) return;
    const mine=b.flows.filter(f=>f.from===e.agent && f.seq!=null).sort((p,q)=>p.seq-q.seq);
    // `calls` 가 인자까지 갖고 있어 정확하다. 옛 런에는 없으므로 `reasonings` 로 물러선다.
    const calls=(e.calls&&e.calls.length) ? e.calls
              : (e.reasonings||[]).filter(r=>r.source==="tool" && r.tool);
    let pi=0, last=(mine.length?mine[0].seq-1:0), eps=0;
    for(const r of calls){
      if(!r.tool || r.tool==="end_turn") continue;
      const ok=r.ok!==false;
      // **투자라고 다 시설이 아니다.** `national`(나라 곳간)·`wellness`(제 수명)는
      // events.jsonl 에 아무 줄도 남기지 않는다 — 그 해 실측 189건·11건이 통째로
      // 안 보였다. 시설 투자만 `facility_gain` 으로 남는다.
      const tgt=(r.args||{}).target;
      const logged = ok && (TOOLED[r.tool] ||
        (r.tool==="invest" && (tgt==null || tgt==="facility")));
      if(logged){ if(mine[pi]){ last=mine[pi].seq; pi++; } eps=0; continue; }
      const act = !ok ? "fail"
                : r.tool==="invest" ? (tgt==="wellness" ? "invest_wellness" : "invest_national")
                : r.tool;
      b.flows.push({kind:"act", act, tool:r.tool, ok, err:r.error||"",
        from:e.agent, seq:last+(++eps)/100});
    }
  });
  // **실제 스텝 순서로 세운다** (요청 1). `seq` 는 투자와 메시지가 한 카운터를 쓰므로
  // 섞어 정렬하면 그 해에 실제로 일어난 차례가 된다. 파일 순서 프록시를 대신한다.
  // 옛 런에는 `seq` 가 없다 — 그때는 넣은 순서를 그대로 둔다.
  for(const t in byTurn){
    const f=byTurn[t].flows;
    if(f.some(x=>x.seq!=null)) f.sort((p,q)=>(p.seq??1e9)-(q.seq??1e9));
  }
  // 임계값(목표) — config_snapshot.yaml 에서 읽는다
  const cfg=files["config_snapshot.yaml"]||"";
  const gi=cfg.match(/^\s*interceptor:\s*([\d.]+)/m);
  const gb=cfg.match(/^\s*bunker:\s*([\d.]+)/m);
  const threshold={ interceptor: gi?+gi[1]:null, bunker: gb?+gb[1]:null };
  const glb=cfg.match(/learn_base:\s*([\d.]+)/);
  const learnBase=glb?+glb[1]:200;
  // **세계의 길이는 설정이 안다** (8/28 · Eddie). 데이터 길이(D.turns)로 세면 진행 중인
  // 런에서 카운트다운이 짧아진다 — 29해까지 기록된 런을 열면 1해에 「운석까지 28해」.
  const gtt=cfg.match(/total_turns:\s*(\d+)/);
  const totalTurns=gtt?+gtt[1]:null;
  // 사망 이벤트를 who 로 찾아 유언 조회
  const testaments={};
  events.forEach(e=>{ if(e.type==="death" && (e.testament||"").trim()) testaments[e.who]=e.testament; });
  // 요격기 완성 시점·승자 (임계 도달한 첫 해). 없으면 멸망
  let completeTurn=null, winner=null;
  const ithr=threshold.interceptor;
  if(ithr){ for(let t=1;t<=turns && !winner;t++){ const n=byTurn[t].nations;
    for(const nat in (n.progress||{})){ if((n.land&&n.land[nat])==="interceptor" && n.progress[nat]>=ithr){
      completeTurn=t; winner=nat; break; } } } }
  // **한 번 정한 자리는 죽을 때까지 지킨다** (8/28 · Eddie). 전에는 번호순으로 세웠다 —
  // Ranoa5 가 죽고 Ranoa8 이 이으면 8 이 가장 큰 번호라 **맨 끝자리로 밀려나고**, 그 여파로
  // 남은 둘도 한 칸씩 움직였다. 사람이 하나 죽을 때마다 나라 전체가 자리를 바꾸는 셈이라
  // 같은 사람을 해 넘어가며 눈으로 따라갈 수가 없었다.
  //
  // `birth.replaces` 가 「누구 자리를 잇는가」 를 정확히 말해 준다 — 그대로 물려받는다.
  const seat={};                       // 행위자 → 자리 번호 (0·1·2)
  {
    const held={};                     // 나라 → 자리별 현재 주인
    // `state.jsonl` 은 한 해에 스냅숏을 여러 줄 쓴다 — 중복을 걷지 않으면 같은 사람이
    // 자리를 셋 다 먹는다
    [...new Set(state.filter(s=>s.turn===1).map(s=>s.agent))]
      .sort((p,q)=>(+p.match(/\d+/))-(+q.match(/\d+/)))
      .forEach(a=>{ const n=natOf(a), arr=(held[n]=held[n]||[]);
        if(arr.length<3){ seat[a]=arr.length; arr.push(a); } });
    // 파일 순서가 곧 시간 순서다 — 태어난 차례대로 자리를 물려받는다
    events.filter(e=>e.type==="birth").forEach(e=>{
      const n=natOf(e.id), arr=(held[n]=held[n]||[]);
      let s=(e.replaces!=null && seat[e.replaces]!=null) ? seat[e.replaces]
          : (arr.length<3 ? arr.length : 0);
      seat[e.id]=s; arr[s]=e.id;
    });
  }
  return {turns, total: totalTurns||turns, byTurn, threshold, learnBase, testaments, completeTurn, winner, seat};
}

// 한 나라의 그 해 에이전트 — **자리 번호가 곧 인덱스**다 (번호순이 아니다).
// 빈 칸이 생길 수 있으므로 부르는 쪽에서 건너뛴다.
function agentsOf(frame,nat){
  const out=[];
  for(const a of Object.values(frame.agents)){
    if(natOf(a.agent)!==nat) continue;
    const s=D.seat[a.agent];
    if(s==null||s>2) continue;
    // **죽은 해에는 한 자리를 둘이 잡는다.** `frame.agents` 가 그 해의 스냅숏을 전부
    // 합치기 때문이다 — 연중 행에는 죽을 사람이, 해 끝 행에는 후계자가 들어 있다.
    // 그 해에 움직인 쪽(죽는 사람)을 세운다. 후계자는 그 해에 행동하지 않는다 —
    // 계승은 해 끝의 고리로 보이고, 후계자는 다음 해에 같은 자리에 선다.
    if(out[s]){ if(frame.births.has(a.agent)) continue;
                if(!frame.births.has(out[s].agent)) continue; }
    out[s]=a;
  }
  return out;
}

// 採決로 이 해에 시설이 바뀌는 나라들 — yearend 에 링·헤더를 바꾼다
let pendingLand=[];
function applyPendingLand(){
  for(const q of pendingLand){
    const el=document.getElementById("nat-"+q.nat);
    if(el){
      el.querySelector(".nland").textContent=q.land?(q.land==="interceptor"?"🛰 迎撃機":"🕳 バンカー"):"未定";
      const pr=el.querySelector(".prow span:last-child");
      if(pr) pr.textContent=`${Math.round(q.prog)} / ${q.thr?Math.round(q.thr):"?"}${q.done?" ✅":""}`;
      const bi=el.querySelector(".bar>i");
      if(bi){ bi.style.width=q.pct+"%"; bi.style.background=q.done?"#3fb950":HEX[q.lang]; }
    }
    const old=document.getElementById("cmark-"+q.nat); if(old) old.remove();
    if(q.land && CONT[q.nat]){
      const col=q.land==="bunker"?"#ffcf7a":"#7fe0ff";
      const m=document.createElement("div"); m.className="cmark"; m.id="cmark-"+q.nat;
      m.style.left=CONT[q.nat][0]+"%"; m.style.top=CONT[q.nat][1]+"%";
      m.style.setProperty("--c",col); m.style.setProperty("--p",Math.round(q.pct));
      m.style.setProperty("--own", HEX[q.lang]+"54");
      m.innerHTML=`<div class="cring"><span class="cicon">${q.land==="bunker"?"🕳️":"🛰️"}</span></div>`+
        `<div class="clabel" style="color:${col}">${q.done?"完成 ✅":Math.round(q.pct)+"%"}</div>`;
      document.querySelector(".globe").appendChild(m);

      ag.innerHTML=`

      // 슬롯 3개(아크). 가운데(부채 꼭지)는 항상 2, 양옆은 위·왼쪽부터 1·3
      //

      // 지구에서 **멀어지는** 쪽으로 벌어졌다 (Asla 기준 위 ox +41 → 아래 ox −145).

      //

      const flip = Math.abs(ux) > 0.3 ? -1 : 1;

      const out=[slots[0],slots[2]].sort((a,b)=> (a.oy-b.oy) || (a.ox-b.ox));
      const ordered=[out[0], slots[1], out[1]];   // #1(위/왼) · #2(가운데) · #3
      const minOy=Math.min(...ordered.map(s=>s.oy)), maxOy=Math.max(...ordered.map(s=>s.oy));

      [...ags.children].forEach(ag=>{ const s=ordered[+ag.dataset.seat];

    frame.deaths.filter(d=>d.country===nat).forEach(d=>{

      }

    });

  $("#yr").textContent=turn;
  $("#scrub").value=turn;
  if(focusAgent && !$("#side").hidden) renderSide();   // 해 넘어가면 상세도 갱신

}

// 엔딩 — 요격 성공(파란 빔) or 멸망(운석 폭발)
let endState="";
function checkEnding(){
  if(!D) return;
  const winNow=D.winner && turn>=D.completeTurn;      // 요격기 완성됨
  // **세계 길이 기준** (8/28 · Eddie). `D.turns`(데이터 길이)로 쟀더니 29해까지만
  // 기록된 런에서 29해 끝에 멸망이 터졌다. 운석은 30해 끝에 온다 — 카운트다운과 같은 자.
  const impactNow=!D.winner && turn>=D.total;         // 30해까지 아무도 못 막음
  const ready=(winNow||impactNow) && flowPhase>=1;    // 그 해 행동이 다 끝난 뒤에만
  $("#meteor").style.opacity = (winNow && flowPhase>=1) ? "0" : "1";
  const now = !ready ? "" : (winNow?"win":"impact");
  if(now===endState) return;
  endState=now;
  ["#flash","#beam","#endbanner"].forEach(s=>{ $(s).className=""; $(s).style.opacity=""; });
  if(now==="win") fireBeam();
  else if(now==="impact") fireImpact();
}
function fireImpact(){
  void $("#flash").offsetWidth;
  $("#flash").className="boom";
  const b=$("#endbanner"); b.textContent="☄  地球滅亡"; b.style.color="#ff6a4a";
  void b.offsetWidth; b.className="show";
}
function fireBeam(){
  const mk=$("#cmark-"+D.winner), m=$("#meteor");
  if(mk&&m){ const r=mk.getBoundingClientRect(), mr=m.getBoundingClientRect();
    const x0=r.left+r.width/2, y0=r.top+r.height/2, x1=mr.left+mr.width/2, y1=mr.top+mr.height/2;
    const len=Math.hypot(x1-x0,y1-y0), ang=Math.atan2(y1-y0,x1-x0)*180/Math.PI;
    const bm=$("#beam"); bm.style.width="10px"; bm.style.height=len+"px";
    bm.style.left=x0+"px"; bm.style.top=y0+"px";
    bm.style.transformOrigin="center top"; bm.style.transform=`translateX(-50%) rotate(${ang-90}deg)`;
    void bm.offsetWidth; bm.className="fire"; }
  void $("#flash").offsetWidth; $("#flash").className="boom blue";
  const b=$("#endbanner"); b.textContent="🛰  迎撃成功・"+D.winner; b.style.color="#7fe0ff";
  void b.offsetWidth; b.className="show";
}

// 운석 — 해가 갈수록 굴러 내려오고, 10해 페이즈마다 이펙트가 세지고, 배경이 물든다
function meteor(){
  if(!D) return;
  const prog=Math.min(1, turn/D.total);          // 0 → 1 (충돌) — 세계 길이 기준
  const phase=Math.min(3, Math.ceil(turn/10));    // 1·2·3 (10해 단위)
  const m=$("#meteor"), sp=$("#space");
  const size=52+prog*150;                          // 멀리 작게 → 가까이 크게
  m.style.width=size+"px"; m.style.height=size+"px";
  m.style.left=(72-prog*23)+"%";                   // 우상단에서 가운데로
  m.style.top=(2+prog*40)+"%";
  // 불꽃(글로우) 페이즈마다 세게
  const glow=10+phase*12, red=255, grn=Math.max(40,150-phase*40);
  $("#rock").querySelector("img").style.filter=
    `drop-shadow(0 0 ${glow}px rgba(${red},${grn},40,${.55+phase*.12}))`;
  $("#rock").style.animationDuration=(11-phase*2)+"s";   // 가까울수록 빨리 구른다
  $("#trail").style.opacity=(.25+phase*.22).toFixed(2);
  $("#trail").style.height=(26+phase*10)+"%";
  // 배경 — 아래에서 붉은 기운이 차오른다
  const top=(prog*0.9).toFixed(2), bot=(prog*0.55).toFixed(2);
  const R=Math.round(165*prog), G=Math.round(28*prog);
  sp.style.background=
    `radial-gradient(1900px 1300px at ${56-prog*6}% -6%, rgba(${R},${G},12,${top}) 0%, transparent 52%),`+
    `radial-gradient(1500px 1000px at 50% 132%, rgba(${Math.round(100*prog)},10,8,${bot}) 0%, transparent 60%),`+
    `#000`;
  // 카운트다운
  $("#ttl").textContent=Math.max(0, D.total-turn);   // 세계 길이 기준 — 시뮬 진실과 같은 자
}

// ── 개인 행동선 ─────────────────────────────────────────────────────
const SVG="http://www.w3.org/2000/svg";
let flowPhase=0, flowRaf=null, flowLast=0, flowCount=1;
const SPREAD_G=0.82;                 // 흐름이 펼쳐지는 구간 (뒤는 여운)
// **색이 행위의 계열을 말한다** (8/28 · Eddie). 전에는 타국투자가 분홍(#f778ba) 이라
// AI 대화의 보라(#a371f7) 와 색상환에서 이웃이었다 — 계열이 다른 두 행위가 서로 닮아
// 보이고, 정작 같은 투자인 자국투자(시안) 와는 남처럼 보였다.
//
//   투자·건설 = 한랭 계열 (자국 시안 → 타국 파랑)   진척을 **쌓는** 행위
//   파괴      = 적색 · 점선 · 반대로 휨              진척을 **깎는** 행위
//   대화      = 보라 · 초록 · 회색                   말이 **어떻게** 건너갔는가
//   계승      = 금빛 고리                            자리를 물려받는다
//
// 대화 셋만은 한 계열로 묶지 않는다. 「AI 번역이냐 원어냐」 가 이 작품이 보려는 축이라
// 한 계열로 뭉개면 관측하려던 것이 화면에서 사라진다.
// **선의 문법** (8/28 · Eddie): 실선 = 자원이 움직인다 (투자·건설 푸른 계열, 파괴 적색).
// 점선 = 말이 움직인다 — 색은 **무슨 말로 했나**: 모국어 옅은 녹색 · 배운 외국어 짙은
// 녹색 · 번역기 주황. 대상이 아니라 발화 언어가 색을 정한다.
const COL={
  invest:"#7fe0ff", investF:"#4c9aff", destroy:"#ff5c5c",
  ai:"#ff9e3d", msgNative:"#9fe6a0", msgLearned:"#2ea043",
  original:"#3fb950", domestic:"#8b97b5", succeed:"#e8c98a",
  // 화살표가 없는 행위들 — 표식의 색. 투자 둘은 한랭 계열을 그대로 쓴다
  learn:"#ffd24a", observe:"#7fd8c0", vote:"#9fc6ff",
  memory_write:"#c0a6ff", fail:"#8b949e",
  invest_national:"#8fd8ff", invest_wellness:"#a8e6cf",
};
const ACTMARK={learn:"📖", observe:"🔭", vote:"🗳", memory_write:"📝", fail:"✕",
  invest_national:"🏦", invest_wellness:"🌿"};
function qbez(a,c,b,t){ const u=1-t;
  return {x:u*u*a.x+2*u*t*c.x+t*t*b.x, y:u*u*a.y+2*u*t*c.y+t*t*b.y}; }
function ctrl(a,b,bow){ const mx=(a.x+b.x)/2,my=(a.y+b.y)/2,dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1;
  return {x:mx-dy/L*bow, y:my+dx/L*bow}; }
function ptOf(id){ const el=document.getElementById(id); if(!el) return null;
  const r=el.getBoundingClientRect(); return {x:r.left+r.width/2, y:r.top+r.height/2}; }
function svgEl(tag,attrs){ const e=document.createElementNS(SVG,tag);
  for(const k in attrs) e.setAttribute(k,attrs[k]); return e; }

// **머리를 키운다** (8/28 · Eddie). 전에는 `ah=16` 고정이라, 굵기 11px 짜리 투자선
// 끝에 붙어도 선폭보다 조금 큰 정도였다 — 멀리서 보면 화살표가 아니라 그냥 선이었다.
// 굵기에 비례해 키우고, 뒤에 홈을 파 화살촉 모양을 분명히 한다.
function arrowHead(svg,tip,ang,size,col,op){
  const S=0.46;                                   // 벌어지는 각
  const p=(a,d)=>({x:tip.x-size*d*Math.cos(a), y:tip.y-size*d*Math.sin(a)});
  const b1=p(ang-S,1), b2=p(ang+S,1), nk=p(ang,0.56);
  const d=`M${tip.x} ${tip.y} L${b1.x} ${b1.y} L${nk.x} ${nk.y} L${b2.x} ${b2.y} Z`;
  // 지구 위에서도 보이도록 어두운 테두리를 먼저
  svg.appendChild(svgEl("path",{d, fill:"#04070e", stroke:"#04070e", "stroke-width":3.4,
    "stroke-linejoin":"round", opacity:op*0.6}));
  svg.appendChild(svgEl("path",{d, fill:col, "stroke-linejoin":"round", opacity:op}));
}

// 화살표가 없는 행위 — 그 사람 곁에 작은 표식을 남긴다.
// **차례를 쓰고도 화면에 아무 자국이 없던 것들**이 여기로 들어온다 (8/28 · Eddie):
// 메모 쓰기 · 나라 곳간 투자 · 수명 투자 · 그리고 실패한 시도.
function actBadge(svg,e,td,rec,dim,tokPt){
  const p=tokPt(e.from); if(!p) return;
  const g=ACTMARK[e.act]; if(!g) return;
  const col=COL[e.act]||"#9fb0c9";
  const bad=e.act==="fail";
  const op=(dim?0.10:(bad?0.5:1))*rec*Math.min(1,td*2.4);
  const R=bad?12:15, ox=p.x+31, oy=p.y-30;
  svg.appendChild(svgEl("circle",{cx:ox, cy:oy, r:R, fill:"#0a1020",
    stroke:col, "stroke-width":bad?1.6:2.2, opacity:op*0.95}));
  const t=svgEl("text",{x:ox, y:oy+0.5, "text-anchor":"middle",
    "dominant-baseline":"central", "font-size":bad?14:16, fill:col, opacity:op});
  t.textContent=g; svg.appendChild(t);
  // 표식도 클릭하면 상세 (8/28 · Eddie)
  { const hit=svgEl("circle",{cx:ox, cy:oy, r:R+5, fill:"#fff", "fill-opacity":0});
    hit.style.pointerEvents="auto"; hit.style.cursor="pointer";
    hit.onclick=ev=>{ ev.stopPropagation(); showEdge(e); };
    svg.appendChild(hit); }
}

// 계승 — 자리는 그대로다. 그래서 어디로 가는 선이 아니라 **제자리에서 도는 고리**다.
function succLoop(svg,e,td,rec,dim,tokPt){
  const p=tokPt(e.to)||tokPt(e.from); if(!p) return;
  const col=COL.succeed, op=(dim?0.10:0.95)*rec;
  const R=46, a0=Math.PI*0.80, a1=-Math.PI*0.28;      // 왼쪽 위에서 오른쪽 위로 한 바퀴
  const at=a0+(a1-a0)*td;
  const pt=a=>({x:p.x+R*Math.cos(a), y:p.y-R*Math.sin(a)});
  const N=Math.max(2,Math.round(Math.abs(at-a0)/0.06));
  let d=`M${pt(a0).x} ${pt(a0).y}`;
  for(let k=1;k<=N;k++){ const q=pt(a0+(at-a0)*k/N); d+=` L${q.x} ${q.y}`; }
  svg.appendChild(svgEl("path",{d, fill:"none", stroke:"#04070e", "stroke-width":6.6,
    "stroke-linecap":"round", "stroke-opacity":op*0.55}));
  svg.appendChild(svgEl("path",{d, fill:"none", stroke:col, "stroke-width":3.4,
    "stroke-linecap":"round", "stroke-opacity":op, "stroke-dasharray":"7 5"}));
  if(td>0.06){ const tip=pt(at), prev=pt(at-(at-a0)*0.02);
    arrowHead(svg, tip, Math.atan2(tip.y-prev.y, tip.x-prev.x), 19, col, op); }
  const lab=svgEl("text",{x:p.x, y:p.y-R-14, "text-anchor":"middle", "font-size":13,
    "font-weight":"700", fill:col, opacity:op});
  lab.textContent=`☠ ${e.from}（${e.age}歳） → ${e.to}`;
  svg.appendChild(lab);
}

// **연속한 같은 행위만 합친다** (8/27 · Eddie). 「투자·투자·투자」 는 한 화살표가
// 맞지만 「투자·대화·투자」 는 두 번이다 — 그 사이에 다른 일이 있었으므로.
//
// 전에는 (사람→대상) 키로 그 해 전체를 합쳤다. 그래서 10해 실측에서 행위 72건이
// 화살표 34개가 되고, **한 사람이 연달아 다섯 번 투자한 것과 해가 갈리도록 띄엄띄엄
// 다섯 번 투자한 것이 같은 그림**이 됐다.
//
// **그리는 쪽과 세는 쪽이 같은 함수를 쓴다** — 액션 슬라이더가 해마다 몇 칸인지
// 알아야 하는데, 두 벌로 두면 필터를 켜고 끌 때 눈금과 그림이 어긋난다.
function edgesOf(frame){
  const openBy={}, list=[];            // 사람 → 지금 이어지는 화살표
  frame.flows.forEach((f,fi)=>{
    if(f.kind==="msg" && !showMsg) return;
    if(f.kind==="invest"||f.kind==="destroy"){ if(!showInvest) return; }
    // **투자와 파괴를 한 통에 넣지 않는다** — 부호가 반대라 합치면 서로를 지운다
    // 화살표 없는 행위(학습·관측·표)는 `act` 로 각각 한 칸을 차지한다 — 합치지 않는다.
    const key=f.kind==="msg"?`m|${f.from}|${f.to}`
             :f.kind==="act"?`a|${f.from}|${f.act}|${f.seq}`
             :`${f.kind[0]}|${f.from}|${f.toNat}`;
    let e=openBy[f.from];
    if(!e || e.key!==key){          // 하던 것과 다른 행위 → 새 화살표를 연다
      // **표의 내용을 여기서 흘리고 있었다** (8/28 · Eddie). 「투표 숫자가 안 바뀐다」 —
      // `flows` 에는 `choice` 가 있는데 이 화살표 객체로 옮겨 담지 않아서, 집계하는 쪽의
      // `e.choice` 가 언제나 `undefined` 였다. 그래서 `choice in tal[n]` 이 늘 거짓이 되고
      // 「투표 진행중」 의 세 숫자가 0 에서 꼼짝하지 않았다. 표는 제대로 던져지고 있었다.
      e={key, kind:f.kind, act:f.act, from:f.from, to:f.to, toNat:f.toNat, foreign:f.foreign,
         items:[], wforeign:false, lang:f.lang, choice:f.choice, ok:f.ok,
         choice:f.choice, tool:f.tool, ok:f.ok, age:f.age,
         count:0, amount:0, gain:0, ai:false, orig:false,
         // **첫 등장으로 자리를 잡는다.** 마지막으로 덮어쓰면 초반에 한 일이 후반으로
         // 밀린다 — `seq` 로 정렬해 놓고도 순서가 어긋나던 이유다.
         idx:fi, seq:f.seq};
      openBy[f.from]=e; list.push(e);
    }
    e.count++; e.items.push(f);
    if(f.kind!=="msg"){ e.amount+=f.amount||0; e.gain+=f.gain||0; }
    else { if(f.route==="ai")e.ai=true; if(f.route==="original")e.orig=true;
           if(f.wforeign)e.wforeign=true; }
  });
  return list;
}

function drawFlows(){
  const svg=$("#flow"); svg.innerHTML="";
  if(!D) return;
  svg.setAttribute("viewBox",`0 0 ${innerWidth} ${innerHeight}`);
  const frame=D.byTurn[turn]; if(!frame) return;
  const TOKR=33;
  const tokPt=id=>ptOf("tok-"+id) || (frame.succ[id]?ptOf("tok-"+frame.succ[id]):null);
  const canon=id=>frame.succ[id]||id;          // 죽은 행위자 → 후손 (집중 매칭용)

  const list=edgesOf(frame);
  const SPREAD=SPREAD_G;
  // **한 순간에 한 행위만 그린다** (8/27 · Eddie). 순서는 `seq` 가 정하고, 재생은
  // 한 칸에 하나씩 — 앞엣것이 다 그려진 뒤에 다음이 시작한다.
  //
  // 전에는 `GROW` 가 0.14 로 **고정**이고 간격이 `0.82/M` 이었다. 화살표가 41개면
  // 간격이 0.020 이라 **일곱 개가 동시에 자랐다.** 느리게 해도 같이 느려질 뿐
  // 「동시에 흐른다」 는 그대로였다.
  //
  // `seq` 비례로 펼치는 것도 되돌린다 — 한 응답에서 연달아 부른 것들은 seq 가 붙어
  // 있어 사실상 같은 자리에 겹친다. **순서는 seq 가, 간격은 칸이 정한다.**
  const M=list.length||1;
  list.forEach((e,i)=>{ e._s=(i/M)*SPREAD; e._i=i; });
  const GROW=SPREAD/M;                 // 한 칸 = 한 행위. 겹치지 않는다
  flowCount=M;                         // 재생 속도를 행위 하나 기준으로 잡는 데 쓴다
  // #2 FIFO — 사람마다 나온 순서대로, 최근 것이 진하고 오래된 건 흐려지며 사라진다
  // **그리는 조건과 같은 부등호를 쓴다** (8/27 · Eddie). 순위는 `>=`, 그리기는 `>` 라
  // 칸 경계에서 **아직 안 그려진 화살표**가 순위에 끼어들었다. 그러면 방금 그려진 것이
  // rank 1 로 밀려 **처음부터 0.42 로 흐리게** 나온다 — 41칸 중 40칸이 그랬다.
  // 수동 스텝은 매 칸이 정확히 그 경계다.
  const grp={}; list.forEach(e=>{ (grp[e.from]=grp[e.from]||[]).push(e); });
  for(const s in grp){ grp[s].forEach(e=>e._rank=99);
    grp[s].filter(e=>flowPhase>e._s).sort((a,b)=>b._s-a._s).forEach((e,r)=>e._rank=r); }
  const recOp=r=> r===0?1 : r===1?0.42 : r===2?0.12 : 0;   // 최근2 진하게, 그 뒤 페이드아웃
  const inFocus=e=> !focusAgent || canon(e.from)===focusAgent || (e.kind==="msg"&&canon(e.to)===focusAgent);

  // **지금 움직이는 사람**을 찾아 테두리를 준다 (8/27 · Eddie). 한 칸씩 짚어 볼 때
  // 행위자가 불분명했다 — 아홉 명이 다 색 테두리를 두르고 있었기 때문이다.
  {
    // **그리는 조건과 같은 자로 고른다** (8/27 · Eddie). `flowPhase` 에서 역산해
    // `floor` 를 취하면 칸 경계에서 한 칸 어긋난다 — 화살표는 X2 인데 테두리는 A1 이었다.
    // 아래 그리기 루프의 조건(`flowPhase > e._s`)을 그대로 써서 **마지막으로 그려진
    // 화살표**를 집는다. 두 곳이 같은 식을 쓰므로 부동소수점까지 일치한다.
    let cur=null;
    for(const e of list){ if(flowPhase > e._s) cur=e; else break; }
    const who=cur ? cur.from : null;
    // **집계는 지금까지 들어온 표만 센다** — 「투표 진행중」 이 말 그대로가 된다
    const tal={}, cast=new Set();
    for(const e of list){
      if(flowPhase <= e._s) break;
      if(e.kind==="act" && e.act==="vote"){
        const n=natOf(e.from); (tal[n]=tal[n]||{interceptor:0,bunker:0,abstain:0});
        if(e.choice in tal[n]) tal[n][e.choice]++;
        cast.add(canon(e.from));
      }
    }
    for(const nat in POS) for(const ch of ["interceptor","bunker","abstain"]){
      const b=document.getElementById(`bal-${nat}-${ch}`);
      if(!b) continue;
      const v=String((tal[nat]&&tal[nat][ch])||0);
      // 숫자가 실제로 올라간 칸만 튕긴다 — 매 프레임 튕기면 계속 떨린다
      if(b.textContent!==v){ b.textContent=v; b.classList.add("bump");
        setTimeout(()=>b.classList.remove("bump"),180); }
    }
    // 사람 밑의 표 뱃지도 같은 시점에 켠다
    document.querySelectorAll(".bal").forEach(el=>
      el.classList.toggle("pending", !cast.has(el.id.slice(6))));
    // **해 끝 사건은 해 끝에** (8/27 · Eddie). 국토 결정·유언은 정산에서 일어나므로
    // 그 해의 행위가 다 흐른 뒤에 나타나야 한다 — 처음부터 떠 있으면 결말을 미리 안다.
    const ye=flowPhase>=SPREAD;
    if(ye && pendingLand.length) applyPendingLand();   // 개표 — 이 순간 시설이 바뀐다
    $("#stage").classList.toggle("yearend", ye);
    document.querySelectorAll(".tok.acting").forEach(t=>t.classList.remove("acting"));
    if(who){ const el=document.getElementById("tok-"+(frame.succ[who]||who))
                   || document.getElementById("tok-"+who);
      if(el) el.classList.add("acting"); }
  }
  // **같은 짝끼리만 부채로 벌린다** (8/28 · Eddie). 「화살표가 이상하게 꾸불텅거린다」 의
  // 절반은 여기였다 — 전에는 `bow += ((i%3)-1)*15` 로 **그 해 전체 순번**을 3 으로 나눈
  // 나머지만큼 휘었다. 겹치지도 않는 화살표가 이웃한 순번을 받았다는 이유만으로 제각기
  // 다른 곡률을 얻어, 나란히 가야 할 선들이 저마다 다르게 휘고 짝이 겹칠 때는 오히려
  // 포개졌다. 겹치는 짝만, 가운데를 기준으로 대칭으로 벌린다.
  {
    const pk=e=> e.kind==="msg" ? `m|${canon(e.from)}|${canon(e.to)}`
                                : `${e.kind[0]}|${canon(e.from)}|${e.toNat}`;
    const cnt={}, seen={};
    list.forEach(e=>{ const k=pk(e); cnt[k]=(cnt[k]||0)+1; });
    list.forEach(e=>{ const k=pk(e), n=cnt[k], j=(seen[k]=(seen[k]??-1)+1);
      e._fan = n>1 ? (j-(n-1)/2)*16 : 0; });
  }
  list.forEach((e,i)=>{
    const local=(flowPhase - e._s)/GROW;
    if(local<=0) return;
    const rec=recOp(e._rank);          // FIFO 최근도
    if(rec<=0.02) return;              // 오래된 건 사라짐
    const td=Math.min(1,local), growing=td<1, dim=focusAgent && !inFocus(e);
    // 화살표가 없는 행위 — 칸을 차지하되, 이제 작은 표식은 남긴다
    if(e.kind==="act"){ actBadge(svg,e,td,rec,dim,tokPt); return; }
    if(e.kind==="succeed"){ succLoop(svg,e,td,rec,dim,tokPt); return; }
    // **파괴는 투자와 다른 그림이어야 한다** (8/27). 전에는 `facility_gain` 을 전부
    // 투자로 그렸는데, `destroy` 는 진척을 **깎는** 행위다 — 같은 화살표로 그리면
    // 보드가 거짓을 말한다. 붉게, 반대로 휘고, 점선으로 가른다.
    let src,dst,col,bow,dash="", invest=e.kind==="invest", wreck=e.kind==="destroy", onRing=false;
    if(invest||wreck){ src=tokPt(e.from);
      // **진척 대신 실제 시설로** — 막대는 숫자일 뿐, 화살표가 향할 곳은 지구 위
      // 그 나라가 짓고 있는 시설(원형 링)이다. 採決 전이라 링이 아직 없는 첫 해만
      // 막대로 물러선다.
      const ring=ptOf("cmark-"+e.toNat); onRing=!!ring;
      dst=ring||ptOf("bar-"+e.toNat);
      col=wreck?COL.destroy:(e.foreign?COL.investF:COL.invest);
      bow=(e.foreign?46:22)*(wreck?-1:1); }         // 자원의 선은 **실선** — 파괴 포함
    else{ src=tokPt(e.from); dst=tokPt(e.to);
      // 말의 선은 **전부 점선**, 색은 발화 언어가 정한다 (대상 무관)
      col=e.ai?COL.ai : e.wforeign?COL.msgLearned : COL.msgNative;
      bow=(natOf(e.from)===natOf(e.to))?18:42; dash="6 5"; }
    if(!src||!dst) return;
    bow += e._fan;
    const d0={x:dst.x-src.x,y:dst.y-src.y}, L0=Math.hypot(d0.x,d0.y)||1;
    const a={x:src.x+d0.x/L0*TOKR, y:src.y+d0.y/L0*TOKR};
    // 링 반지름(36px)만큼 물러선다 — 막대는 얇아 그대로 14px 이면 됐지만,
    // 링은 커서 그만큼 안 물러서면 화살촉이 아이콘 안으로 파고든다
    const backR=(invest||wreck)?(onRing?34:14):TOKR;
    const cRaw=ctrl(a,dst,bow);
    const tg={x:dst.x-cRaw.x,y:dst.y-cRaw.y}, tl=Math.hypot(tg.x,tg.y)||1;
    const bEnd={x:dst.x-tg.x/tl*backR, y:dst.y-tg.y/tl*backR};
    const c=ctrl(a,bEnd,bow);
    const op=(dim?0.08:0.85)*rec;
    const domestic=!invest&&!wreck&&e.kind==="msg"&&natOf(e.from)===natOf(e.to);
    const w=(invest||wreck) ? 5.5+Math.min(6,(e.count-1)*1.2)   // 액수 아닌 횟수로
          : (domestic?2.6:4.2)+Math.min(4,(e.count-1)*0.9);   // 자국 대화는 한 단계 얇게
    // 아크: 그 자리에 자라 쌓이며 멈춘다 (사라졌다 다시 안 나옴)
    //
    // **곡선을 곡선으로 그린다** (8/28 · Eddie). 「화살표가 이상하게 꾸불텅거린다」 의
    // 나머지 절반 — 곡선을 직선 14 조각으로 근사하고 있었다. 길이 600px 짜리 선이면
    // 한 조각이 43px 라 꺾인 자리가 그대로 보이고, `stroke-linecap:round` 가 그 마디마다
    // 둥근 이음매를 얹어 선이 울퉁불퉁 흔들리는 것처럼 보였다.
    //
    // 2차 베지에의 0..t 구간은 **그 자체로 2차 베지에**다 (de Casteljau). 제어점만 다시
    // 잡으면 근사 없이 `Q` 한 번에 그려진다 — 조각도 마디도 없다.
    const c1={x:a.x+(c.x-a.x)*td, y:a.y+(c.y-a.y)*td};
    const tip=qbez(a,c,bEnd,td);
    const dstr=`M${a.x} ${a.y} Q${c1.x} ${c1.y} ${tip.x} ${tip.y}`;
    // 어두운 테두리 — 지구 위에서도 선이 보이게
    svg.appendChild(svgEl("path",{d:dstr, fill:"none", stroke:"#04070e", "stroke-width":w+3.4,
      "stroke-linecap":"round", "stroke-opacity":(dim?0.05:0.55)*rec, ...(dash?{"stroke-dasharray":dash}:{}) }));
    svg.appendChild(svgEl("path",{d:dstr, fill:"none", stroke:col, "stroke-width":w,
      "stroke-linecap":"round", "stroke-opacity":op, ...(dash?{"stroke-dasharray":dash}:{}) }));
    // **클릭하면 상세** (8/28 · Eddie). #flow 가 pointer-events:none 이므로 이 투명
    // 선만 다시 켠다 — 가는 선도 집기 쉽게 두께를 넉넉히 준다.
    { const hit=svgEl("path",{d:dstr, fill:"none", stroke:"#fff", "stroke-opacity":0,
        "stroke-width":Math.max(20,w+14)});
      hit.style.pointerEvents="stroke"; hit.style.cursor="pointer";
      hit.onclick=ev=>{ ev.stopPropagation(); showEdge(e); };
      svg.appendChild(hit); }
    svg.appendChild(svgEl("circle",{cx:a.x, cy:a.y, r:4.2, fill:col, opacity:(dim?0.1:0.7)*rec}));
    if(growing && !dim){ const hd=qbez(a,c,bEnd,td);
      const dot=svgEl("circle",{cx:hd.x, cy:hd.y, r:invest?6.5:5.5, fill:col, opacity:0.95*rec});
      dot.style.filter=`drop-shadow(0 0 6px ${col})`; svg.appendChild(dot); }
    // 머리는 굵기에 비례해 키운다 — 16px 고정이던 시절엔 굵은 투자선에 파묻혔다
    if(td>=0.98 && !dim){
      arrowHead(svg, bEnd, Math.atan2(tg.y,tg.x), Math.max(22, w*3.2), col, 0.9*rec);
      // 화살표와 같은 색으로 「진척 +N」 — 도착점(링)도 시작점(토큰 머리)도 붐빈다.
      // **선 자체를 자리로 쓴다** — 중간 지점에, 선과 겹치지 않게 수직으로 살짝
      // 띄운다. 겹치는 화살표끼리는 이미 `_fan` 으로 곡률이 벌어져 있으므로 각자
      // 다른 곡선의 중간이면 자연히 서로 떨어진다. 같은 사람이 최근 여럿 쌓았을
      // 때만(_rank) 곡선을 따라 한 번 더 벌린다.
      if(invest||wreck){
        const mt=Math.max(0.2,Math.min(0.8, 0.5+(e._rank-1)*0.16));
        const mp=qbez(a,c,bEnd,mt), mp2=qbez(a,c,bEnd,Math.min(0.97,mt+0.05));
        const tx=mp2.x-mp.x, ty=mp2.y-mp.y, tl=Math.hypot(tx,ty)||1;
        const side=(bow>=0?1:-1)*20;                 // 곡선이 휜 쪽 반대로 띄운다
        const lx=mp.x-ty/tl*side, ly=mp.y+tx/tl*side;
        const lbl=`${e.gain>=0?"+":""}${Math.round(e.gain)}`, txt=`進捗 ${lbl}`;
        const tw=txt.length*10+22;                    // 더 크게 (8/28 · Eddie)
        svg.appendChild(svgEl("rect",{x:lx-tw/2, y:ly-16, width:tw, height:32, rx:16,
          fill:"#04070ee6", stroke:col, "stroke-width":2, opacity:0.97*rec}));
        const t=svgEl("text",{x:lx, y:ly+6, "text-anchor":"middle","font-size":18,
          "font-weight":800, fill:col, opacity:rec});
        t.textContent=txt; svg.appendChild(t);
      }
    }
  });
}
function animate(ts){ if(!flowLast)flowLast=ts; const dt=ts-flowLast; flowLast=ts;
  // **속도는 행위 하나 기준이다** (8/27 · Eddie). 한 해 길이로 잡으면 바쁜 해가 오히려
  // 빨라진다 — 화살표 56개인 해는 칸이 123ms, 30개인 해는 230ms 였다. 거꾸로다.
  // 칸 길이를 고정하고 한 해 길이를 그 해의 행위 수로 늘린다.
  const PER=+($("#speed")?.value||220);      // 행위 하나가 그려지는 시간 (ms)
  const LOOP=Math.max(900, PER*flowCount/SPREAD_G);
  // **멈추면 멈춘다** (8/27 · Eddie). 전에는 정지 중에도 `flowPhase` 가 계속 올라
  // 「한 바퀴 돌고 전체를 보여준다」 였다. 그러면 재생 버튼에 뜻이 없고, 방향키로
  // 한 칸 짚어 놓으면 그 자리가 저 혼자 흘러가 버린다.
  //
  // 정지 중에는 `←→`(한 행위)·`≪≫`(한 해)·눈금만이 시점을 옮긴다.
  if(!playing){ flowRaf=requestAnimationFrame(animate); return; }
  flowPhase += dt/LOOP;
  if(actCount.length) $("#scrub").value=actNow();
  if(flowPhase>=1){
    if(turn>=D.turns){ playing=false; $("#play").textContent="▶"; flowPhase=1; }
    else{ turn++; render(); flowPhase=0; }     // 다음 해로 넘어가며 이어 흐른다
  }
  drawFlows();
  checkEnding();        // 그 해 행동 끝(flowPhase>=1)나면 엔딩 발동
  flowRaf=requestAnimationFrame(animate); }

const esc=s=>(s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const LANGNAME={ja:"Asla語", zh:"Ranoa語", fr:"Miris語"};
const CHOICENAME={interceptor:"迎撃機", bunker:"バンカー", abstain:"棄権"};
// 화살표·표식 클릭 → 무엇이 오갔는지 전부 (8/28 · Eddie)
function showEdge(e){
  const year=41+turn;
  let title, h="";
  if(e.kind==="msg"){
    const how=e.ai?"AI翻訳":(e.wforeign?"習得した外国語":"母語");
    title=`${year}年 · ${e.from} → ${e.to} · 会話（${how}）`;
    for(const f of e.items){
      const badge=f.route==="ai"?"🟠 AI翻訳":(f.wforeign?"🟢 習得した外国語":"🍃 母語");
      h+=`<div class="pmsg"><div class="phead">${badge} · ${f.delivered?"配達済み":"❌ 届かず"}</div>`
        +`<div class="ptext">${esc(f.tw)}</div>`
        +((f.route==="ai"&&f.tdel&&f.tdel!==f.tw)?`<div class="ptr">翻訳文 → ${esc(f.tdel)}</div>`:"")
        +`</div>`;
    }
  }else if(e.kind==="invest"||e.kind==="destroy"){
    title=`${year}年 · ${e.from} → ${e.toNat} ${e.kind==="destroy"?"破壊":(e.foreign?"他国施設投資":"自国施設投資")}`;
    // **낸 양은 안 적는다** (8/28 · Eddie). 세계가 에이전트에게도 숨기는 값이고,
    // 보는 사람에게 의미 있는 것은 몇 번 냈고 얼마나 나아갔는가뿐이다.
    h+=`<div class="phead">${e.count}回 · 進捗 ${e.gain>=0?"+":""}${Math.round(e.gain)}</div>`;
    h+=`<div class="pmsg">`;
    for(const f of e.items)
      h+=`<div class="ptext">· ${f.gain>=0?"+":""}${f.gain}${f.gain<0?"（逆効果）":""}</div>`;
    h+=`</div>`;
  }else{
    const NAME={learn:"学習", observe:"観測", vote:"投票", memory_write:"メモ", fail:"失敗した試み",
                invest_national:"国家投資", invest_wellness:"寿命投資"};
    title=`${year}年 · ${e.from} · ${NAME[e.act]||e.act}`;
    h+=`<div class="pmsg"><div class="ptext">`
      +(e.act==="learn"&&e.lang?`${LANGNAME[e.lang]||e.lang}学習`:"")
      +(e.act==="vote"&&e.choice?`${CHOICENAME[e.choice]||e.choice}に投票`:"")
      +(e.act==="fail"?"資源不足などで失敗した行動":"")
      +`</div></div>`;
  }
  openModalHTML(title, h||"<div class='pmsg'>記録なし</div>");
}
function openModal(title,text){ $("#mtitle").textContent=title; $("#mbody").textContent=text;
  $("#modal").hidden=false; }
function openModalHTML(title,html){ $("#mtitle").textContent=title; $("#mbody").innerHTML=html;
  $("#modal").hidden=false; }
function closeModal(){ $("#modal").hidden=true; }

// 사람 클릭 → 사이드 패널에 그 해 그 사람이 한 것 전부 + 그 사람 선만 집중
function shiftBoard(){ const t = $("#side").hidden ? "" : "scale(.7)";
  $("#stage").style.transform=t; $("#backlayer").style.transform=t;   // 지구도 같이 축소
  // 정지 중엔 애니 루프가 drawFlows 를 안 하므로, 스케일 전환 동안 화살표를 다시 그린다
  let n=0; const iv=setInterval(()=>{ drawFlows(); if(++n>24) clearInterval(iv); },16); }
function markSelected(){ document.querySelectorAll(".tok.sel").forEach(t=>t.classList.remove("sel"));
  if(focusAgent){ const t=document.getElementById("tok-"+focusAgent); if(t) t.classList.add("sel"); } }
function openSide(agent){ focusAgent=agent;
  // **짚어 둔 자리를 유지한다** (8/27). 전에는 `flowPhase=1` 로 그 해 끝까지 밀었다 —
  // 정지가 진짜 정지가 된 뒤로는 그게 시점을 통째로 옮겨 버린다.
  $("#side").hidden=false; shiftBoard(); markSelected(); renderSide(); }   // transform 으로 부드럽게 축소
function closeSide(){ focusAgent=null; $("#side").hidden=true; shiftBoard(); markSelected(); }
function renderSide(){
  if(!focusAgent){ return; }
  const frame=D.byTurn[turn], canon=id=>frame.succ[id]||id, agent=focusAgent, st=frame.agents[agent]||{};
  const agentC=canon(agent);   // 그 해에 죽은 사람 이름으로 눌러도 후계자와 같은 자리로 묶는다
  const sent=frame.flows.filter(f=>canon(f.from)===agentC);
  const recv=frame.flows.filter(f=>f.kind==="msg" && canon(f.to)===agentC);
  const inv=sent.filter(f=>f.kind==="invest"), talk=sent.filter(f=>f.kind==="msg");
  const totalInv=inv.reduce((s,f)=>s+(f.amount||0),0), totalGain=inv.reduce((s,f)=>s+(f.gain||0),0);
  let h="";
  if(inv.length){ h+=`<div class="dsec"><h4>🎯 投資 · 合計 ${Math.round(totalInv)} → 進捗 +${Math.round(totalGain)}</h4>`;
    inv.forEach(f=>{ const own=natOf(agent)===f.toNat;
      h+=`<div class="drow ${own?'own':'foreign'}">→ <b>${f.toNat}</b> ${own?'自国':'他国'}施設 · ${Math.round(f.amount)} 投資 <span class="gain">進捗 +${f.gain}</span></div>`; });
    h+=`</div>`; }
  if(talk.length){ h+=`<div class="dsec"><h4>💬 送ったメッセージ (${talk.length})</h4>`;
    talk.forEach(f=>{ const tag=f.route==="ai"?"AI翻訳":f.route==="original"?"原語":"自国語";
      h+=`<div class="drow"><b>→ ${f.to}</b> <span class="tag ${f.route}">${tag}</span><div class="txt">${esc(f.text)||"<i>内容なし</i>"}</div></div>`; });
    h+=`</div>`; }
  if(recv.length){ h+=`<div class="dsec"><h4>📥 受け取ったメッセージ (${recv.length})</h4>`;
    recv.forEach(f=>{ h+=`<div class="drow"><b>${f.from} →</b><div class="txt">${esc(f.text)}</div></div>`; });
    h+=`</div>`; }
  const lp=Object.entries(st.lang_progress||{}).filter(([l,v])=>v<D.learnBase);
  if(lp.length){ h+=`<div class="dsec"><h4>📖 学習中</h4>`;
    lp.forEach(([l,v])=>h+=`<div class="drow">${langName(l)} ${Math.round(v)}/${D.learnBase}</div>`); h+=`</div>`; }
  const mem=(st.memory||"").trim();
  if(mem) h+=`<div class="dsec"><h4>📝 メモ</h4><div class="txt">${esc(mem)}</div></div>`;
  if(!h) h=`<div class="drow">この年に記録された行動はありません。</div>`;
  $("#stitle").textContent=`${agent}${st.age!=null?" · "+st.age+"歳":""}`;
  $("#sbody").innerHTML=h;
}

function goto(t){
  turn=Math.min(D.turns,Math.max(1,t));
  render();
  // 그 해의 **첫 행위**가 그려진 상태로 선다. 0 으로 두면 아무것도 안 보이고,
  // 1 로 두면 그 해 전체가 한꺼번에 나와 「한 순간에 하나씩」 이 깨진다.
  flowPhase=(1/Math.max(1,actCount[turn]||1))*SPREAD_G;
  $("#scrub").value=actBase[turn]+1;
  drawFlows();
}
function play(){
  playing=!playing; $("#play").textContent=playing?"⏸":"▶";
  // **선 자리에서 이어 흐른다.** 전에는 켤 때마다 그 해를 처음부터 다시 돌렸다 —
  // 방향키로 짚어 놓은 자리가 사라진다. 끝까지 간 뒤에만 처음으로 되돌린다.
  if(playing && turn>=D.turns && flowPhase>=1){ turn=1; flowPhase=0; render(); }
  flowLast=0;
}
function stop(){ playing=false; $("#play").textContent="▶"; }

// ── 액션 색인 (8/27 · Eddie) ────────────────────────────────────────────────
// 슬라이더를 **해가 아니라 행위** 단위로 둔다. 한 해가 60~70건이라 해 단위 눈금으로는
// 그 안을 못 들여다본다. 방향키는 한 행위씩, `≪ ≫` 는 한 해씩 움직인다.
//
// 필터(대화/투자)를 끄고 켜면 칸 수가 달라지므로 **그때마다 다시 센다** — 안 그러면
// 눈금과 그림이 어긋난다.
let actCount=[], actBase=[], actTotal=0;
function reindex(){
  actCount=[0]; actBase=[0]; actTotal=0;
  for(let t=1;t<=D.turns;t++){
    const n=Math.max(1, edgesOf(D.byTurn[t]).length);   // 빈 해도 한 칸은 준다
    actBase[t]=actTotal; actCount[t]=n; actTotal+=n;
  }
  const sc=$("#scrub"); sc.min=1; sc.max=actTotal;
  sc.value=actBase[turn]+1;
}
// 전역 행위 번호(1부터) → 그 해의 그 시점으로
function gotoAct(k){
  k=Math.min(actTotal,Math.max(1,k));
  let t=1; while(t<D.turns && k>actBase[t]+actCount[t]) t++;
  const within=k-actBase[t];                       // 1..actCount[t]
  if(t!==turn){ turn=t; render(); }
  // 화살표 i 는 (i/M)*SPREAD 에 시작해 ((i+1)/M)*SPREAD 에 끝난다.
  // `within` 개가 **다 그려진** 순간이 곧 그 시점이다.
  flowPhase=(within/actCount[t])*SPREAD_G;
  $("#scrub").value=k;
  drawFlows();
}
function actNow(){
  // **그 해 안으로 자른다.** flowPhase 는 SPREAD 를 넘어 1 까지 가므로(여운 구간),
  // 그대로 환산하면 다음 해의 눈금을 가리킨다.
  const w=Math.min(actCount[turn], Math.max(1,
    Math.round(flowPhase/SPREAD_G*actCount[turn])));
  return actBase[turn]+w;
}

function start(data,name){
  D=data; turn=1; $("#drop").style.display="none";
  $("#runname").textContent=name;
  render(); reindex();
  if(!flowRaf) flowRaf=requestAnimationFrame(animate);
}

async function loadRun(run){
  const files=await readFetch(run);
  if(!files["state.jsonl"]) return false;
  start(build(files),run); return true;
}

function bind(){
  $("#back").onclick=()=>{stop();goto(turn-1);};      // ≪ 는 한 해
  $("#fwd").onclick=()=>{stop();goto(turn+1);};
  $("#play").onclick=play;
  $("#scrub").oninput=e=>{stop();gotoAct(+e.target.value);};   // 눈금은 한 행위
  const pick=()=>$("#picker").click();
  $("#loadbtn").onclick=pick; $("#dropbtn").onclick=pick;
  $("#picker").onchange=async e=>{
    const files={}; let name="アップロード";
    for(const f of e.target.files){ if(NAMES.includes(f.name)) files[f.name]=await f.text();
      if(f.webkitRelativePath) name=f.webkitRelativePath.split("/")[0]; }
    if(files["state.jsonl"]) start(build(files),name);
  };
  $("#f-invest").onclick=()=>{ showInvest=!showInvest; $("#f-invest").classList.toggle("on",showInvest);
    // 칸 수가 달라지므로 다시 세고, **보던 자리는 지킨다** (0 으로 두면 화면이 빈다)
    const keep=actNow(); reindex(); gotoAct(keep); };
  $("#f-msg").onclick=()=>{ showMsg=!showMsg; $("#f-msg").classList.toggle("on",showMsg);
    // 칸 수가 달라지므로 다시 세고, **보던 자리는 지킨다** (0 으로 두면 화면이 빈다)
    const keep=actNow(); reindex(); gotoAct(keep); };
  $("#sclose").onclick=closeSide;
  $("#stage").onclick=e=>{ if(e.target.id==="stage") closeSide(); };   // 빈 곳 클릭 → 집중해제
  $("#mclose").onclick=closeModal;
  $("#modal").onclick=e=>{ if(e.target.id==="modal") closeModal(); };
  // 정지 중에는 애니 루프가 `drawFlows` 를 부르지 않는다 — 다시 그려 주지 않으면
  // 창을 줄이는 순간 화살표와 표 뱃지가 통째로 사라진 채로 남는다
  addEventListener("resize",()=>{ if(D){ render(); drawFlows(); } });
  addEventListener("keydown",e=>{ if(e.key==="Escape"){closeModal();closeSide();}
    if($("#modal").hidden===false) return;
    if(e.key===" "){e.preventDefault();play();}
    // **방향키는 한 행위씩** — 해를 넘기는 것은 `≪ ≫` 다
    if(e.key==="ArrowRight"){e.preventDefault();stop();gotoAct(actNow()+1);}
    if(e.key==="ArrowLeft"){e.preventDefault();stop();gotoAct(actNow()-1);} });
}

(async function init(){
  bind();
  const q=new URLSearchParams(location.search).get("run");
  if(q && await loadRun(q)) return;
  // 동봉 견본 (8/29): 98% 근접 실패(009) → 28해 배신 드라마(001) 순으로 시도
  if(await loadRun("260827-009-ai006")) return;
  if(await loadRun("260827-001-risk-noai")) return;
  $("#drop").style.display="flex";
